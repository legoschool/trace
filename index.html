<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="글·사진·링크·파일을 블로그처럼 이어 쓰고, 내 구글 드라이브 폴더에 마크다운으로 쌓는 개인 지식·경험 관리 체계 TRACE 의 기록 도구" />
<meta name="theme-color" content="#2f5fd6" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="기록장" />
<title>구글 기록장 · TRACE 개인 지식·경험 관리 체계</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- 폴더·파일 고르기 창(구글 Picker). 좁은 권한에서 «밖에 있는 파일» 을 집어 오는 유일한 통로다. -->
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  /* =========================================================
     모양 토큰 · 「프리셋」은 이 값들만 갈아 끼운다

     ⚠️ 프리셋마다 화면 CSS 를 따로 쓰지 마세요.
        그러면 기능을 하나 고칠 때마다 프리셋 수만큼 고쳐야 합니다.
        새 화면을 만들 때도 색·굵기·모서리는 반드시 아래 토큰으로 쓰세요.
        그래야 프리셋은 저절로 따라옵니다.
     ========================================================= */
  /* =========================================================
     보는 것을 정하는 축 넷 · 서로 섞이지 않게 갈라 둔다.

       data-theme  모양   글꼴 · 모서리 · 테두리 굵기 · 돌기 · 여백
       data-mode   밝기   (없음)=기기 따름 · light=밝게 · dark=어둡게
       data-size   글자   (없음)=보통 · big=크게 · huge=아주 크게
       (색감은 아직 모양에 붙어 있다. 다음 묶음에서 가른다)

     ⚠️ 한 축을 고쳐도 다른 축이 안 흔들려야 한다. 그래야 «일관적» 이다.
        그래서 화면 CSS 는 하나뿐이고, 축들은 «토큰 값» 만 바꾼다.
     ========================================================= */
  :root {
    /* 글자 크기 배율. 화면 CSS 의 모든 font-size 가 이 값을 곱해 쓴다.
       ⚠️ 12px 아래로는 내려가지 않게 해 두었다. 그 밑은 읽으라고 둔 글자가 아니다. */
    --fs: 1;

    --bg: #f5f7fb; --panel: #fff; --ink: #1b2130; --ink-soft: #667085;
    --brand: #2f5fd6; --brand-dark: #24499f; --brand-soft: #eaf0ff;
    --line: #e3e8f2; --line-soft: #eef1f7;
    /* 딱딱한 그림자(블록·블록놀이가 쓰는 «찍힌» 그림자)의 색.
       모양이 이 값을 «가리키기만» 하므로, 색감을 바꾸면 그림자도 따라온다. */
    --hard: #1b2130;
    --danger: #d64545; --ok: #1a9e5f; --warn: #b07a00;
    /* 알림 띠 · 뜻(주의/됨)은 그대로 두고 색만 프리셋이 고를 수 있게 한다 */
    --warn-bg: #fff8e6; --warn-line: #f0dca8; --warn-ink: #6b4e00;
    --ok-bg: #eaf7f0; --ok-line: #b9e3cd; --ok-ink: #0f5c39;
    --pin-bg: #fff4d6;
    --shadow: 0 1px 3px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);

    /* 글꼴 */
    --font-body: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    --font-title: var(--font-body);
    --title-spacing: -.3px;

    /* 선·모서리 */
    --bw: 1px;                 /* 테두리 굵기 */
    --radius: 14px;            /* 카드 */
    --r-btn: 10px;             /* 단추 */
    --r-btn-sm: 8px;
    --r-inp: 10px;             /* 입력칸 */
    --r-pill: 999px;           /* 둥근 딱지(배지·태그·칩) */
    --r-block: 12px;           /* 에디터 블록 */

    /* 기록 카드.
       ⚠️ --entry-bg: var(--c-soft) 처럼 쓰면 안 된다. 안쪽 var() 는 «선언한 곳(html)» 에서 풀려서
          카드마다 다른 --c-soft 를 못 본다. 그래서 «덮개» 를 걷는 방식으로 한다. 
          카드 바탕은 언제나 유형 색이고, 기본 프리셋은 그 위를 종이색으로 덮어 가린다. */
    --veil: var(--panel);      /* 종이색 덮개. transparent 로 바꾸면 유형 색이 드러난다 */
    --entry-pt: 16px;          /* 위쪽 여백 (돌기가 있으면 넓어진다) */
    --accent-w: 3px;           /* 위쪽 색줄 */
    --accent-l: 0px;           /* 왼쪽 색줄 */
    --stud: none;              /* 레고 돌기 · 브릭 계열 프리셋만 block */
    --stud-w: 82px;            /* 돌기 줄 너비 */
    --stud-h: 11px;            /* 돌기 지름 */
    --stud-step: 21px;         /* 돌기 사이 간격 */

    /* 유형 색 여섯 자리. 유형은 사용자가 더 만들 수 있어서 «차례»로 돌려 쓴다.
       기본 프리셋은 여섯 자리가 모두 같은 파랑 · 지금 화면 그대로다. */
    --t1: #2f5fd6; --t1s: #eaf0ff;
    --t2: #2f5fd6; --t2s: #eaf0ff;
    --t3: #2f5fd6; --t3s: #eaf0ff;
    --t4: #2f5fd6; --t4s: #eaf0ff;
    --t5: #2f5fd6; --t5s: #eaf0ff;
    --t6: #2f5fd6; --t6s: #eaf0ff;
  }

  /* =========================================================
     모양은 «레고» 하나 · **색은 한 톨도 없다.**
     색은 아래 «색감» 이 맡는다. 색감 여섯이 이 한 모양 위에서 갈아입는다.
     예전에는 일곱이었다 (메모지·블록·공책·블록놀이·문서·설계도·기본).
     일곱을 고르게 하니 고르는 일 자체가 짐이었다. 이 도구의 정체성은 하나다 ·
     납작한 색면 · 둥근 모서리 · 돌기 · 둥근 제목 글꼴 · 잘 읽히는 고딕 본문.
     ⚠️ 여기에 색을 적고 싶어지면, 그건 색감에 적어야 하는 것이다.
     ========================================================= */
  [data-theme="lego"] {
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.07);
    --font-title: "Jua", var(--font-body); --title-spacing: 0px;
    --bw: 1px;                   /* 테두리는 머리카락만큼 · 색면이 말하게 둔다 */
    --radius: 20px; --r-btn: 12px; --r-btn-sm: 10px; --r-inp: 12px; --r-pill: 999px; --r-block: 14px;
    --veil: transparent;         /* 기록 카드에 유형 색이 그대로 드러난다 */
    --entry-pt: 30px;
    --accent-w: 0px;
    --stud: block; --stud-w: 96px; --stud-h: 14px; --stud-step: 24px;
  }
  /* 머리띠 · 강조색 판. 색은 색감의 --brand 를 «가리키기만» 한다 */
  [data-theme="lego"] header.top { background: var(--brand); border-bottom: none; }
  [data-theme="lego"] .logo { color: var(--panel); }
  [data-theme="lego"] .logo small { color: var(--panel); opacity: .78; }
  [data-theme="lego"] header.top .acct { color: var(--panel); opacity: .85; }
  /* «방금 동기화» 도 판 위에서 읽혀야 한다. busy(도는 중)는 조금 더 또렷하게 */
  [data-theme="lego"] header.top .syncpill { color: var(--panel); opacity: .8; }
  [data-theme="lego"] header.top .syncpill.busy { opacity: 1; }
  /* 돌기 셋 · 첨부 시안의 상단 점 · 레고라는 것을 머리띠가 스스로 말한다 */
  [data-theme="lego"] .logo::before {
    content: ""; flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%;
    background: var(--panel); opacity: .45; margin-right: 32px;
    box-shadow: 15px 0 0 var(--panel), 30px 0 0 var(--panel);
  }
  /* ---------- 선 아이콘 · 그림글자 대신 ----------
     currentColor 를 쓰므로 어느 색감·밝기에서도 글자와 같은 색으로 선다. */
  .bico { width: calc(19px * var(--fs)); height: calc(19px * var(--fs)); flex: 0 0 auto;
          fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .top-inner .btn.sm { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
  .vbtn .bico { width: calc(16px * var(--fs)); height: calc(16px * var(--fs)); vertical-align: -3px; }
  .vbtn { display: inline-flex; align-items: center; gap: 5px; }
  .logomark { width: calc(21px * var(--fs)); height: calc(21px * var(--fs)); flex: 0 0 auto;
              fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 키보드로 다니는 사람에게도 «지금 어디» 가 보여야 한다 */
  .btn:focus-visible, .siderow:focus-visible, .vbtn:focus-visible, .burgerbtn:focus-visible,
  .chip:focus-visible, .tonebtn:focus-visible, .pickbtn:focus-visible {
    outline: 2.5px solid var(--brand); outline-offset: 2px;
  }
  [data-theme="lego"] header.top .btn:focus-visible,
  [data-theme="lego"] .burgerbtn:focus-visible { outline-color: var(--panel); }

  /* 머리띠 위 단추 · 흰 알약 (시안의 「교사용 지도안」) · 로그인만 진하게 */
  [data-theme="lego"] header.top .btn.sm { border-color: transparent; }
  [data-theme="lego"] header.top .btn.primary {
    background: var(--panel); color: var(--brand); border-color: transparent; font-weight: 700;
  }
  @media (max-width: 720px) {
    [data-theme="lego"] .logo::before { display: none; }   /* 폰에서는 자리가 좁다 */
  }

  /* =========================================================
     왼쪽 · 폴더 구조
     PC 에서는 늘 보이는 왼쪽 기둥, 폰에서는 줄 셋(☰)으로 여는 서랍.
     같은 것을 자리만 달리해 보여 준다 · 배우는 것이 하나여야 한다.
     ========================================================= */
  .layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); max-width: 1290px; margin: 0 auto; }
  #sideNav { background: var(--panel); border-right: 1px solid var(--line-soft); padding: 16px 12px 20px;
             align-self: start; position: sticky; top: 66px; max-height: calc(100vh - 78px); overflow: auto; }
  #sideNav .sidehead { display: flex; align-items: center; gap: 8px; padding: 2px 8px 10px;
                       font-family: var(--font-title); font-size: calc(16px * var(--fs)); letter-spacing: var(--title-spacing); }
  #sideNav .sidehead svg { flex: 0 0 auto; }
  #sideNav .sidehead .x { margin-left: auto; display: none; background: none; border: none;
                          color: var(--ink-soft); font-size: calc(18px * var(--fs)); padding: 4px 8px; cursor: pointer; }
  .siderow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
             background: none; border: none; font: inherit; color: var(--ink); cursor: pointer;
             padding: 9px 10px; border-radius: var(--r-btn); font-size: calc(14.5px * var(--fs)); }
  .siderow:hover { background: var(--brand-soft); }
  .siderow svg { flex: 0 0 auto; color: var(--ink-soft); }
  /* ▸ 접힘 손잡이 · 돌아가며 편다. 자식이 없으면 빈 칸으로 자리만 지킨다 */
  .sidetog { flex: 0 0 auto; width: 22px; height: 22px; display: flex; align-items: center;
             justify-content: center; border-radius: 6px; color: var(--ink-soft);
             transition: transform .15s ease; }
  .sidetog:hover { background: var(--line-soft); }
  .sidetog.open { transform: rotate(90deg); }
  .sidetog.none { visibility: hidden; }
  .siderow.on .sidetog { color: var(--brand); }
  .siderow .n { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .siderow .cnt { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .siderow.on { background: var(--brand-soft); color: var(--brand-dark); font-weight: 700; }
  .siderow.on svg, .siderow.on .cnt { color: var(--brand); }
  .siderow.d1 { padding-left: 26px; } .siderow.d2 { padding-left: 42px; } .siderow.d3 { padding-left: 58px; }
  .sidenew { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
             margin-top: 14px; background: var(--brand); color: var(--panel); border: none; cursor: pointer;
             font-family: var(--font-title); letter-spacing: var(--title-spacing);
             font-size: calc(16px * var(--fs)); border-radius: var(--r-btn); padding: 12px; }
  .sidenew:hover { background: var(--brand-dark); }
  /* ＋ 새 기록 옆에 붙은 ▾ · 열에 아홉은 그냥 왼쪽을 누른다.
     자리를 바꾸는 일은 드무니 ▾ 뒤에 접어 둔다. 자주 안 쓰는 것을 앞에 세우지 않는다. */
  .sidenewrow { display: flex; gap: 2px; margin-top: 14px; }
  .sidenewrow .sidenew { margin-top: 0; border-radius: var(--r-btn) 0 0 var(--r-btn); flex: 1 1 auto; }
  .sidenewmore { flex: 0 0 auto; width: 42px; background: var(--brand-dark); color: var(--panel);
                 border: none; cursor: pointer; border-radius: 0 var(--r-btn) var(--r-btn) 0;
                 font-size: calc(13px * var(--fs)); }
  .sidenewmore:hover { filter: brightness(1.14); }
  .sidemenu { margin: 6px 0 0; border: 1px solid var(--line); border-radius: var(--r-btn);
              background: var(--panel); overflow: hidden; }
  .sidemenu button { display: block; width: 100%; text-align: left; background: none; border: none;
                     font: inherit; color: var(--ink); cursor: pointer; padding: 10px 12px;
                     font-size: calc(13.5px * var(--fs)); line-height: 1.5; }
  .sidemenu button:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .sidemenu button small { display: block; color: var(--ink-soft); font-size: calc(11.5px * var(--fs)); }
  .sidemenu button:hover small { color: inherit; }
  .sidemenu .sep { height: 1px; background: var(--line-soft); }
  .sidemenu .note { padding: 9px 12px; font-size: calc(11.5px * var(--fs)); color: var(--ink-soft);
                    line-height: 1.65; background: var(--bg); }
  /* 지금 «여기에 쓴다» 는 자리 · 보고 있는 자리(on)와 눈으로 구분되어야 한다 */
  .siderow.desk { box-shadow: inset 3px 0 0 var(--brand); }
  .siderow .pin { flex: 0 0 auto; font-size: calc(11px * var(--fs)); color: var(--brand); font-weight: 700; }

  /* 작성칸 접기 · 폴더를 볼 때는 목록이 위로 올라온다 */
  .cfold { display: none; }
  .composer.collapsed { padding-top: 14px; padding-bottom: 14px; }
  .composer.collapsed > *:not(.cfold) { display: none; }
  .composer.collapsed .cfold { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cfoldbtn { display: flex; align-items: center; gap: 8px; background: var(--brand); color: var(--panel);
              border: none; cursor: pointer; padding: 11px 20px; border-radius: var(--r-btn);
              font-family: var(--font-title); letter-spacing: var(--title-spacing);
              font-size: calc(16px * var(--fs)); }
  .cfoldbtn:hover { background: var(--brand-dark); }
  .cfoldwhere { font-size: calc(13px * var(--fs)); color: var(--ink-soft); }
  .cfoldwhere b { color: var(--ink); }

  /* 이 기록이 갈 자리 · 작성칸 맨 위 한 줄. 쓰기 전에 어디로 가는지 늘 보인다 */
  .deskline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
              font-size: calc(13px * var(--fs)); color: var(--ink-soft);
              background: var(--bg); border: 1px solid var(--line-soft);
              border-radius: var(--r-btn); padding: 9px 12px; margin: 0 0 12px; }
  .deskline b { color: var(--ink); }
  .deskline .spacer { flex: 1 1 auto; }
  /* 줄 셋(☰) · 어디서나 «폴더 구조를 열고 닫는» 단추다.
     PC 에서는 기둥을 접었다 펴고, 폰에서는 서랍을 연다. 한 단추, 한 뜻. */
  .burgerbtn { display: flex; flex-direction: column; justify-content: center; align-items: center;
               gap: 4.5px; width: 40px; height: 40px; flex: 0 0 auto; cursor: pointer;
               background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--r-btn-sm); }
  .burgerbtn i { display: block; width: 17px; height: 2.5px; border-radius: 2px; background: var(--ink); }
  [data-theme="lego"] .burgerbtn { background: rgba(255,255,255,.16); border-color: transparent; }
  [data-theme="lego"] .burgerbtn i { background: var(--panel); }
  @media (min-width: 1021px) {
    .layout.folded { grid-template-columns: minmax(0, 1fr); }
    .layout.folded #sideNav { display: none; }
  }
  #drawerScrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 59; }
  #drawerScrim.hidden { display: none; }

  @media (max-width: 1020px) {
    .layout { display: block; }
    /* 서랍 · 평소엔 왼쪽 밖에 숨어 있다가 줄 셋을 누르면 나온다.
       ⚠️ align-self 를 되돌려야 한다. 기둥일 때 쓴 start 가 남아 있으면
          고정(fixed) 요소가 위아래로 안 늘어나 서랍이 반토막이 된다. */
    #sideNav { position: fixed; left: 0; top: 0; bottom: 0; align-self: auto;
               max-height: none; width: 292px; z-index: 60;
               border-right: none; border-radius: 0 var(--radius) var(--radius) 0;
               box-shadow: 8px 0 32px rgba(0,0,0,.18);
               transform: translateX(-105%); transition: transform .18s ease; }
    #sideNav.open { transform: none; }
    #sideNav .sidehead .x { display: block; }
  }

  /* ---------- 빈 화면 · 브릭 셋과 단추 하나 ---------- */
  .emptybricks { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .emptybricks i { width: 46px; height: 30px; border-radius: 8px; position: relative; display: block; }
  .emptybricks i::before { content: ""; position: absolute; top: -8px; left: 8px; width: 13px; height: 13px;
                           border-radius: 50%; background: inherit; box-shadow: 17px 0 0 0; }
  .emptytitle { font-family: var(--font-title); letter-spacing: var(--title-spacing);
                font-size: calc(21px * var(--fs)); color: var(--ink); margin: 4px 0 14px; }
  .emptybtn { background: var(--brand); color: var(--panel); border: none; cursor: pointer;
              font-family: var(--font-title); letter-spacing: var(--title-spacing);
              font-size: calc(18px * var(--fs)); border-radius: 14px; padding: 15px 30px;
              box-shadow: 0 5px 16px rgba(0,0,0,.18); }
  .emptybtn:hover { background: var(--brand-dark); }

  /* =========================================================
     색감 여섯 · **모양은 한 톨도 없다.**
     한 벌이 밝을 때와 어두울 때를 «같은 자리» 에 갖는다.

  /* ---------- 글자 크기 ----------
     디자인 시안들이 «본문 최소 20px» 를 말하는 것은 «멀리서 보는 슬라이드» 라서다.
     손에 든 화면은 그럴 필요가 없다. 대신 **눈이 편한 사람마다 다르다** 는 것이 사실이라,
     고를 수 있게 둔다. 모양·색은 그대로고 크기만 바뀐다. */
  :root[data-size="big"]  { --fs: 1.13; }
  :root[data-size="huge"] { --fs: 1.28; }

  /* 밝기·글자 크기를 고르는 줄 · 모양 카드와 같은 결로 */
  .pickrow2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pickbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
             padding: 11px 12px; text-align: left; cursor: pointer;
             border: var(--bw) solid var(--line); border-radius: var(--r-btn);
             background: var(--panel); color: var(--ink); }
  .pickbtn:hover { border-color: var(--brand); }
  .pickbtn.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .pickico { font-size: calc(19px * var(--fs)); line-height: 1.2; }
  .picklabel { font-weight: 700; font-size: calc(13.5px * var(--fs)); }
  .pickwhy { font-size: calc(12px * var(--fs)); color: var(--ink-soft); line-height: 1.5; }
  @media (max-width: 560px) { .pickrow2 { grid-template-columns: 1fr; } }

  /* 색감 고르기 · 견본이 «그 색감의 진짜 값» 으로 칠해진다.
     단추마다 data-tone 이 붙어 있어서, 안쪽 var() 가 그 색감에서 풀린다. */
  .tonerow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tonebtn { display: flex; align-items: center; gap: 9px; padding: 9px 11px; text-align: left;
             cursor: pointer; border: var(--bw) solid var(--line); border-radius: var(--r-btn);
             background: var(--panel); color: var(--ink); }
  .tonebtn:hover { border-color: var(--brand); }
  .tonebtn.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .toneswatch { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; flex: 0 0 auto;
                width: 30px; height: 30px; border-radius: 7px; overflow: hidden;
                border: 1px solid var(--line-soft); }
  .toneswatch i { display: block; }
  .tonename { display: flex; flex-direction: column; min-width: 0; }
  .tonename strong { font-size: calc(13px * var(--fs)); }
  .tonename span { font-size: calc(12px * var(--fs)); color: var(--ink-soft); line-height: 1.45; }
  @media (max-width: 560px) { .tonerow { grid-template-columns: 1fr 1fr; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-body);
    font-size: calc(15px * var(--fs)); line-height: 1.62; -webkit-text-size-adjust: 100%;
  }
  a { color: var(--brand); }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: calc(12.5px * var(--fs)); word-break: break-all; }
  .spacer { flex: 1 1 auto; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- 상단 바 ---------- */
  header.top { position: sticky; top: 0; z-index: 40; background: var(--panel); border-bottom: 1px solid var(--line); }
  /* flex-wrap 이 없으면 단추가 화면 밖으로 밀려난다. 폰에서 실제로 그랬다. */
  .top-inner { max-width: 1000px; margin: 0 auto; padding: 9px 16px; display: flex; align-items: center;
               gap: 10px; flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: calc(16.5px * var(--fs)); letter-spacing: var(--title-spacing); display: flex; align-items: center; gap: 7px;
          font-family: var(--font-title); }
  .logo small { font-weight: 500; font-size: calc(12px * var(--fs)); color: var(--ink-soft); letter-spacing: 0; }
  /* 좁은 화면에서는 머리줄 단추를 그림글자만 남긴다. 한 줄에 들어가야 목록이 위로 올라온다. */
  @media (max-width: 560px) {
    .logo small { display: none; }
    .top-inner { gap: 6px; }
    .top-inner .lbl { display: none; }
    .top-inner .btn.sm { padding: 8px 9px; }
    .logo { font-size: calc(15px * var(--fs)); }
  }
  .acct { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink);
    padding: 8px 14px; border-radius: var(--r-btn); font-weight: 600; font-size: calc(14px * var(--fs)); transition: .15s; white-space: nowrap;
    font-family: var(--font-title); letter-spacing: var(--title-spacing);
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: calc(13px * var(--fs)); border-radius: var(--r-btn-sm); }
  .btn.xs { padding: 2px 7px; font-size: calc(12px * var(--fs)); border-radius: var(--r-btn-sm); font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .card { background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* ---------- 배너 ---------- */
  .banner { margin: 16px 0; padding: 12px 14px; border-radius: 12px; font-size: calc(13.5px * var(--fs));
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); background: var(--panel); }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
  .banner.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); }
  /* 드라이브에서 안 보이게 된 기록. 카드 «안» 에 들어가므로 배너보다 좁다 */
  .banner.gone { margin: 8px 0 0; padding: 8px 11px; font-size: calc(12.5px * var(--fs));
                 background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
  /* 폴더 «밖» 으로 나갔지만 멀쩡히 읽히는 기록. 이건 사고가 아니라 사실 안내다 ·
     노란 경고를 띄우면 고장난 줄 안다. 같은 크기, 조용한 색으로 적는다. */
  .banner.away { margin: 8px 0 0; padding: 8px 11px; font-size: calc(12.5px * var(--fs));
                 background: var(--bg); border-color: var(--line); color: var(--ink-soft); }
  .banner .grow { flex: 1 1 240px; }
  .banner.draft { background: var(--brand-soft); border-color: var(--brand); color: var(--brand);
                  font-weight: 600; margin: 16px 0 -6px; padding: 10px 14px; }
  .banner a { color: inherit; }

  /* ---------- 입력 공통 ---------- */
  .inp { width: 100%; padding: 9px 12px; border: var(--bw) solid var(--line); border-radius: var(--r-inp); background: var(--bg); outline: none; }
  .inp:focus { border-color: var(--brand); background: var(--panel); }
  textarea.inp { resize: vertical; line-height: 1.75; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: calc(13px * var(--fs)); font-weight: 700; margin-bottom: 5px; }
  .desc { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin: 4px 0 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink-soft);
          padding: 6px 12px; border-radius: var(--r-pill); font-size: calc(13px * var(--fs)); font-weight: 600;
          font-family: var(--font-title); }
  .chip.on { background: var(--c-soft, var(--brand-soft)); border-color: var(--c, var(--brand)); color: var(--c, var(--brand)); }

  /* 폴더 고르기 목록 */
  .picklist { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto;
              border: var(--bw) solid var(--line); border-radius: var(--r-inp); padding: 6px; background: var(--bg); }
  .pickrow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit;
             color: var(--ink); background: var(--panel); border: var(--bw) solid var(--line-soft);
             border-radius: var(--r-btn-sm); padding: 8px 10px; }
  .pickrow:hover { border-color: var(--brand); color: var(--brand); }
  .pickrow .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 폴더 정리 방식 고르기 ---------- */
  .modegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
  @media (max-width: 640px) { .modegrid { grid-template-columns: 1fr; } }
  .modecard { text-align: left; border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink);
              border-radius: var(--r-btn); padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; font: inherit; }
  .modecard.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .modecard .desc { margin: 0; }
  .modehead { display: flex; align-items: baseline; gap: 7px; }
  .modehead strong { font-size: calc(14.5px * var(--fs)); font-family: var(--font-title); }
  /* 폴더 그림 · 글자로 그린 나무보다 훨씬 빨리 읽힌다 */
  .ftree { background: var(--bg); border: var(--bw) solid var(--line-soft); border-radius: 9px;
           padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; overflow-x: auto; }
  .frow { display: flex; align-items: center; gap: 6px; font-size: calc(12px * var(--fs)); white-space: nowrap; line-height: 1.5; }
  .frow svg { flex: 0 0 auto; }
  .frow .fname { overflow: hidden; text-overflow: ellipsis; }
  .fnote { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin-left: 4px; }

  /* 목록 보기를 디렉토리처럼 */
  .lfolder { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; font: inherit;
             color: var(--ink); background: var(--bg); border: 0; border-bottom: var(--bw) solid var(--line);
             padding: 9px 12px; font-family: var(--font-title); }
  .lfolder:hover { color: var(--brand); }
  .ltwist { width: 12px; color: var(--ink-soft); }
  .lfname { font-weight: 700; font-size: calc(14px * var(--fs)); }
  .lwrap { display: block; }
  .lrow.lin { padding-left: 34px; }
  /* 연결 펼침 · 잇는 것은 편집·관계망에서, 여기서는 «보기» 만 */
  .linkbtn { border: var(--bw) solid var(--line); background: var(--panel); border-radius: var(--r-pill);
             padding: 1px 8px; font: inherit; font-size: calc(12px * var(--fs)); color: var(--ink-soft); cursor: pointer; }
  .linkbtn:hover, .linkbtn.on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .linkpanel { display: flex; flex-direction: column; gap: 6px; padding: 9px 12px 11px;
               background: var(--bg); border-bottom: var(--bw) solid var(--line-soft); }
  .linkpanel.lin { padding-left: 34px; }
  .linkgroup { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .linklabel { font-size: calc(12px * var(--fs)); color: var(--ink-soft); flex: 0 0 auto; }
  .linkchip { border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink);
              border-radius: var(--r-btn-sm); padding: 2px 9px; font: inherit; font-size: calc(12.5px * var(--fs)); }
  .linkchip:hover { border-color: var(--brand); color: var(--brand); }
  .linkwhy { color: var(--ink-soft); font-size: calc(12px * var(--fs)); }
  .linkhint { font-size: calc(12px * var(--fs)); color: var(--ink-soft); }

  /* ---------- 길찾기 줄 ---------- */
  .crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 0 0 6px; line-height: 1.4; }
  .crumb { border: 0; background: none; padding: 0; font: inherit; font-size: calc(12px * var(--fs)); color: var(--ink-soft);
           text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .crumb:hover { color: var(--brand); }
  .crumb.here { text-decoration: none; color: var(--ink); font-weight: 700; cursor: default; }
  .crumbsep { font-size: calc(12px * var(--fs)); color: var(--ink-soft); opacity: .6; }

  /* ---------- 모양 고르기 ---------- */
  .themegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
  @media (max-width: 860px) { .themegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .themegrid { grid-template-columns: 1fr; } }
  /* 「아이답게 → 정밀하게」 축. 목록 순서가 곧 이 축이라는 것을 한 줄로 알려 준다. */
  .themeaxis { display: flex; align-items: center; gap: 9px; margin: 10px 0 2px;
               font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .themeaxis .axisline { flex: 1 1 auto; height: 2px; border-radius: 2px;
                         background: linear-gradient(90deg, var(--t5), var(--t2)); }
  .themecard { text-align: left; border: var(--bw) solid var(--line); background: var(--panel);
               border-radius: var(--r-btn); padding: 10px; display: flex; flex-direction: column; gap: 7px;
               color: var(--ink); font: inherit; }
  .themecard.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .themecard .desc { margin: 0; }
  .themename { display: flex; align-items: baseline; gap: 7px; }
  .themename strong { font-size: calc(14.5px * var(--fs)); }
  .themename span { font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  /* 미리보기 조각 · 그 프리셋의 토큰을 그대로 쓴다. 따로 색을 적어 두지 않는다. */
  .themeswatch { background: var(--bg); border-radius: 8px; padding: 10px; overflow: hidden; }
  .themeswatch .minicard { position: relative; border: var(--bw) solid var(--line);
                           background-color: var(--c-soft); background-image: linear-gradient(var(--veil), var(--veil));
                           border-radius: var(--radius); box-shadow: var(--shadow);
                           border-top: var(--accent-w) solid var(--c); 
                           border-left-width: var(--accent-l); border-left-style: solid; border-left-color: var(--c);
                           padding: var(--entry-pt) 10px 9px; display: flex; flex-direction: column; gap: 5px; }
  .themeswatch .minicard::before {
    content: ""; display: var(--stud); position: absolute; left: 10px; top: 6px; width: 50px; height: 9px;
    background-image: radial-gradient(circle at 4.5px 4.5px, var(--c) 0 4px, transparent 4.5px);
    background-size: 17px 9px; background-repeat: repeat-x; }
  .themeswatch .minititle { font-family: var(--font-title); font-weight: 700; font-size: calc(13px * var(--fs)); color: var(--ink);
                            letter-spacing: var(--title-spacing); }
  .themeswatch .miniline { height: 5px; border-radius: 3px; background: var(--line-soft); }
  .themeswatch .miniline.short { width: 55%; }
  .themeswatch .minirow { display: flex; gap: 4px; align-items: center; }

  /* ---------- 에디터 ---------- */
  .composer { padding: 18px; margin: 16px 0; }
  .composer h2 { margin: 0 0 12px; font-size: calc(16px * var(--fs)); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  #blocks { margin-top: 4px; }
  .block { border: var(--bw) solid var(--line-soft); border-radius: var(--r-block); background: var(--bg); margin-bottom: 8px; }
  .block:focus-within { border-color: var(--brand); }
  .bhead { display: flex; align-items: center; gap: 4px; padding: 5px 8px 3px; }
  .bkind { font-size: calc(12px * var(--fs)); font-weight: 700; color: var(--ink-soft); padding-left: 3px; }
  /* 순서 바꾸기 · 끌어서 옮기거나, 큰 화살표로 한 칸씩 */
  .bgrip { cursor: grab; font-size: calc(15px * var(--fs)); color: var(--ink-soft); padding: 4px 7px; border-radius: 8px;
           user-select: none; line-height: 1; }
  .bgrip:hover { background: var(--line-soft); color: var(--brand); }
  .bgrip:active { cursor: grabbing; }
  .btn.bmove { font-size: calc(18px * var(--fs)); font-weight: 800; line-height: 1; min-width: 44px; padding: 7px 10px; }
  .block.dragging { opacity: .4; }
  .block.dropbefore { box-shadow: 0 -3px 0 0 var(--brand); }
  .block.dropafter { box-shadow: 0 3px 0 0 var(--brand); }
  .bbody { padding: 0 8px 8px; }
  .bbody textarea, .bbody input { background: var(--panel); }
  .block.text textarea { min-height: 76px; }
  .block.heading input { font-size: calc(17px * var(--fs)); font-weight: 700; }
  .block.quote textarea { border-left: 3px solid var(--brand); font-style: italic; min-height: 56px; }
  .block.divider .bbody { padding: 10px 12px 16px; }
  .block.divider hr { border: none; border-top: 2px dashed var(--line); margin: 0; }
  .media { display: flex; gap: 10px; align-items: flex-start; }
  .media .thumb { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 10px; object-fit: cover; background: var(--line-soft); }
  .media .ficon { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 10px; background: var(--line-soft);
                  display: flex; align-items: center; justify-content: center; font-size: calc(34px * var(--fs)); }
  .media .minfo { flex: 1 1 auto; min-width: 0; }
  /* 파일 이름이 길어도 한 줄에서 끝나게 (전체 이름은 마우스를 올리면 보인다) */
  .media .savedname { font-family: ui-monospace, Consolas, monospace; font-size: calc(12px * var(--fs)); color: var(--brand);
                      display: block; margin-bottom: 2px;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media .origname { font-size: calc(12px * var(--fs)); color: var(--ink-soft); display: block; margin-bottom: 6px;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .addbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); }
  .addbar .btn { background: var(--panel); }
  /* 단추마다 ＋ 를 붙이는 대신, 앞에 크게 하나만 세운다.
     ＋ 는 «누를 것» 이 아니라 «이 아래가 다 넣는 것» 이라는 표지라 단추로 만들지 않는다. */
  .addlead { display: flex; align-items: center; gap: 5px; padding: 0 8px 0 2px; margin-right: 2px;
             align-self: stretch; border-right: 1px solid var(--line); user-select: none; }
  .addplus { font-size: calc(26px * var(--fs)); line-height: 1; font-weight: 800; color: var(--brand); }
  /* 선 아이콘과 글자가 한 줄에 나란히 서게 */
  .addbar [data-add] { display: inline-flex; align-items: center; gap: 6px; }
  .addbar [data-add] svg { flex: 0 0 auto; opacity: .8; }
  .addbar [data-add]:hover svg { opacity: 1; }
  .addlabel { font-size: calc(12.5px * var(--fs)); font-weight: 700; color: var(--ink-soft); }
  @media (max-width: 560px) {
    /* 좁은 화면에서는 ＋ 만 남기고 글자를 뺀다. 한 줄이라도 더 단추가 서야 한다. */
    .addlead { border-right: 0; padding-right: 2px; }
    .addlabel { display: none; }
  }
  .addbar.hover { border-color: var(--brand); background: var(--brand-soft); }
  .addhint { width: 100%; font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin-top: 2px; }

  .composer-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .savehint { font-size: calc(12px * var(--fs)); color: var(--ink-soft); }

  /* ---------- 목록 ---------- */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 24px 0 10px; }
  .toolbar h2 { margin: 0; font-size: calc(16px * var(--fs)); }
  .count { font-size: calc(13px * var(--fs)); color: var(--ink-soft); }
  .search { flex: 0 1 300px; }
  .filters { margin-bottom: 14px; }
  .tagfilters { margin: -8px 0 14px; align-items: center; }
  .flabel { font-size: calc(12px * var(--fs)); color: var(--ink-soft); font-weight: 700; padding-right: 2px; align-self: center; }
  .chip.tagchip { font-size: calc(12.5px * var(--fs)); padding: 5px 11px; }
  .chip.ghostchip { border-style: dashed; }
  .chip.clearchip { border-color: var(--danger); color: var(--danger); }
  .tag.pick { cursor: pointer; }
  .tag.pick:hover { border-color: var(--brand); color: var(--brand); }
  .tag.pick.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

  /* 기록마다 색 줄을 둬서 어디서 끊기는지 한눈에 보이게 한다.
     색은 «유형 색»(--c) 이다. 프리셋이 여섯 자리를 정하고, 카드마다 제 자리 색을 물려받는다. */
  .entry { position: relative; padding: var(--entry-pt) 18px 16px; margin-bottom: 12px;
           background-color: var(--c-soft, var(--panel));
           background-image: linear-gradient(var(--veil), var(--veil));
           border-top: var(--accent-w) solid var(--c, var(--brand));
           border-left-width: var(--accent-l); border-left-style: solid; border-left-color: var(--c, var(--brand)); }
  /* 레고 돌기 · brick 프리셋에서만 나온다 (--stud: block).
     따로 요소를 만들지 않는다. 요소를 만들면 프리셋마다 그리는 코드가 갈라진다. */
  .entry::before {
    content: ""; display: var(--stud); position: absolute; left: 17px; top: 8px;
    width: var(--stud-w); height: var(--stud-h); pointer-events: none;
    background-image: radial-gradient(circle at calc(var(--stud-h) / 2) calc(var(--stud-h) / 2),
                      var(--c, var(--brand)) 0 calc(var(--stud-h) / 2 - .5px), transparent calc(var(--stud-h) / 2));
    background-size: var(--stud-step) var(--stud-h); background-repeat: repeat-x;
  }
  /* 유형 배지 바로 뒤에 제목이 붙고, 길면 그 자리에서 줄만 바뀐다 */
  .entry .head { display: block; }
  .entry .head .badge { display: inline; margin-right: 7px; white-space: nowrap; }
  .entry .head h3 { display: inline; font-size: calc(16.5px * var(--fs)); line-height: 1.45; }
  .entry .head .when { display: block; margin-top: 6px; }
  /* 📌 맨 위 고정 */
  .pinbtn { border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink-soft);
            font-size: calc(12px * var(--fs)); font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill);
            margin-left: 8px; vertical-align: middle; white-space: nowrap; }
  .pinbtn:hover { border-color: var(--brand); color: var(--brand); }
  .pinbtn.on { background: var(--pin-bg); border-color: var(--warn); color: var(--warn); }

  .entry.pinned { border-top-color: var(--warn); border-left-color: var(--warn); }
  .badge { font-size: calc(12px * var(--fs)); font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill);
           background: var(--c-soft, var(--brand-soft)); color: var(--c, var(--brand)); white-space: nowrap;
           font-family: var(--font-title); }
  .entry h3 { margin: 0; font-size: calc(16.5px * var(--fs)); flex: 1 1 auto; min-width: 0;
              font-family: var(--font-title); letter-spacing: var(--title-spacing); }
  .when { font-size: calc(12px * var(--fs)); color: var(--ink-soft); white-space: nowrap; }
  .tags { margin: 7px 0 0; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: calc(12px * var(--fs)); color: var(--ink-soft); background: var(--bg); border: var(--bw) solid var(--line); padding: 1px 8px; border-radius: var(--r-pill); }
  .content { margin-top: 10px; }
  .content > * { margin: 0 0 8px; }
  .content p { white-space: pre-wrap; word-break: break-word; font-size: calc(14.3px * var(--fs)); }
  .content h4 { font-size: calc(15px * var(--fs)); margin-top: 14px; }
  .content blockquote { margin: 0 0 8px; padding: 4px 0 4px 12px; border-left: 3px solid var(--brand); color: var(--ink-soft); font-style: italic; white-space: pre-wrap; }
  .content hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .content figure { margin: 0 0 10px; }
  .content figure img { max-width: 100%; max-height: 420px; border-radius: 10px; display: block; border: 1px solid var(--line); }
  .content figcaption { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin-top: 4px; }
  .content .fileline, .content .linkline {
    display: inline-block; vertical-align: top; font-size: calc(13px * var(--fs));
    border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; background: var(--bg);
    text-decoration: none; color: var(--ink); max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .content .fileline:hover, .content .linkline:hover { border-color: var(--brand); color: var(--brand); }
  .collapsed { max-height: 320px; overflow: hidden; position: relative; }
  .collapsed::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
                      background: linear-gradient(transparent, var(--panel)); }
  .morebtn { display: block; width: 100%; margin-top: 4px; }

  .foot { display: flex; gap: 6px; align-items: center; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .sync-dot { font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .sync-dot.ok { color: var(--ok); }
  .sync-dot.pending { color: var(--warn); }

  .empty { text-align: center; padding: 46px 20px; color: var(--ink-soft); font-size: calc(14px * var(--fs)); }
  .empty .big { font-size: calc(40px * var(--fs)); display: block; margin-bottom: 10px; }

  /* ---------- 토스트/진행 ---------- */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
           background: #1b2130; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: calc(14px * var(--fs));
           opacity: 0; pointer-events: none; transition: .22s; z-index: 210; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
           /* 210 인 이유: 「전체 보기」(140)·사진 창(160)·공유 창(170) 위에서도 알림이 보여야 한다 */
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #progress { position: fixed; left: 0; top: 0; height: 3px; background: var(--brand); width: 0; transition: width .3s; z-index: 200; }

  /* ---------- 모달 ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,35,.55); z-index: 90;
              display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { max-width: 620px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; }
  .modal .mhead { display: flex; align-items: center; gap: 8px; padding: 15px 18px; border-bottom: 1px solid var(--line);
                  flex: 0 0 auto; }
  .modal .mhead h3 { margin: 0; font-size: calc(17px * var(--fs)); }
  /* ⚠️ min-height: 0 이 없으면 몸통이 «내용만큼» 자리를 차지하겠다고 버틴다.
     그러면 바닥줄이 창 밖으로 밀려나 목록 위에 겹쳐 보인다 (엮어내기 창이 그랬다).
     flex 안에서 스크롤 되는 칸은 반드시 이 둘을 함께 줘야 한다. */
  .modal .mbody { padding: 18px; overflow: auto; flex: 1 1 auto; min-height: 0; }
  .modal .mfoot { display: flex; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--line); align-items: center;
                  flex: 0 0 auto; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; padding: 10px 18px 0; flex-wrap: wrap; }
  .tab { border: none; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: calc(13.5px * var(--fs));
         padding: 7px 12px; border-radius: 9px 9px 0 0; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--brand); border-bottom-color: var(--brand); background: var(--brand-soft); }

  .typerow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .typerow .ic { width: 52px; text-align: center; flex: 0 0 auto; }
  .typerow .nm { flex: 1 1 auto; }
  .tokens { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .token { font-size: calc(12px * var(--fs)); border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 2px 8px; font-family: ui-monospace, Consolas, monospace; }
  .preview { margin-top: 8px; padding: 9px 11px; border-radius: 9px; background: var(--brand-soft); font-family: ui-monospace, Consolas, monospace; font-size: calc(12.5px * var(--fs)); word-break: break-all; color: var(--brand); }

  .steps { font-size: calc(13px * var(--fs)); color: var(--ink-soft); padding-left: 18px; margin: 8px 0 0; }
  .steps li { margin-bottom: 4px; }

  /* ---------- 위키링크 [[제목]] ---------- */
  .wikilink {
    color: var(--brand); text-decoration: none; border-bottom: 1px solid transparent;
    background: var(--brand-soft); padding: 0 4px; border-radius: 5px; cursor: pointer;
  }
  .wikilink:hover { border-bottom-color: var(--brand); }
  .wikilink.missing { color: var(--warn); background: transparent; border: 1px dashed var(--warn); opacity: .85; }
  #wikiPop {
    position: absolute; z-index: 60; min-width: 220px; max-width: 340px; max-height: 240px; overflow: auto;
    background: var(--panel); border: 1px solid var(--brand); border-radius: 10px;
    box-shadow: var(--shadow); padding: 4px;
  }
  #wikiPop .wp {
    display: block; width: 100%; text-align: left; border: none; background: transparent; color: var(--ink);
    padding: 7px 9px; border-radius: 7px; font-size: calc(13.5px * var(--fs));
  }
  #wikiPop .wp.on, #wikiPop .wp:hover { background: var(--brand-soft); color: var(--brand); }
  #wikiPop .wp small { display: block; color: var(--ink-soft); font-size: calc(12px * var(--fs)); }
  #wikiPop .wp.on small, #wikiPop .wp:hover small { color: inherit; }
  #wikiPop .cap { font-size: calc(12px * var(--fs)); color: var(--ink-soft); padding: 5px 9px 3px; }

  /* ---------- 연결(백링크) 줄 ---------- */
  .rel { margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .rel .relhead { font-size: calc(12px * var(--fs)); color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .rel .relchips { display: flex; gap: 5px; flex-wrap: wrap; }
  .relchip {
    font-size: calc(12.5px * var(--fs)); border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 999px; padding: 3px 10px; cursor: pointer; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .relchip:hover { border-color: var(--brand); color: var(--brand); }
  .relchip.out::before { content: "→ "; color: var(--ink-soft); }
  .relchip.in::before { content: "← "; color: var(--ink-soft); }
  .relchip.missing { border-style: dashed; color: var(--warn); }
  .entry.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--brand); } 100% { box-shadow: var(--shadow); } }

  /* ---------- 관계망 ---------- */
  .graphmodal { max-width: min(1100px, 96vw); height: min(86vh, 820px); }
  .graphmodal .mbody { padding: 0; flex: 1 1 auto; position: relative; overflow: hidden; }
  #graphCanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #graphCanvas.grabbing { cursor: grabbing; }
  .graphtools {
    position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: var(--shadow);
    max-width: calc(100% - 20px);
  }
  .graphtools .inp { width: 150px; padding: 5px 9px; }
  .graphlegend {
    position: absolute; right: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); font-size: calc(12px * var(--fs)); max-width: 190px;
  }
  .graphlegend .lg { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .graphlegend .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .graphempty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                text-align: center; color: var(--ink-soft); font-size: calc(14px * var(--fs)); padding: 30px; }

  /* ---------- 영상·소리 미리보기 ---------- */
  .media video, .media audio { width: 200px; border-radius: 8px; background: #000; }
  .media audio { background: transparent; }
  .content video { max-width: 100%; max-height: 360px; border-radius: 10px; background: #000; display: block; border: 1px solid var(--line); }
  .content audio { width: 100%; max-width: 420px; display: block; }
  .driveframe { width: 100%; aspect-ratio: 16/9; border: 1px solid var(--line); border-radius: 10px; background: #000; }
  .playbtn {
    display: flex; align-items: center; gap: 10px; width: 100%; max-width: 420px;
    border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px;
    color: var(--ink); font-size: calc(13.5px * var(--fs)); text-align: left;
  }
  .playbtn:hover { border-color: var(--brand); color: var(--brand); }
  .playbtn .pi { font-size: calc(26px * var(--fs)); line-height: 1; }
  .playbtn small { display: block; color: var(--ink-soft); font-size: calc(12px * var(--fs)); }

  /* ---------- 사진 여러 장 · 슬라이드 ---------- */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin: 0 0 10px; }
  .gallery button { padding: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--bg); position: relative; aspect-ratio: 1; }
  .gallery button:hover { border-color: var(--brand); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery .more { position: absolute; inset: 0; background: rgba(15,20,35,.62); color: #fff;
                   display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(17px * var(--fs)); }
  .galcap { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin: -4px 0 10px; }

  /* 사진 창은 무엇보다 위에. (전체 보기가 140 이라 130 이면 그 뒤에 깔린다) */
  .lightbox { position: fixed; inset: 0; z-index: 160; background: rgba(8,10,18,.94);
              display: flex; flex-direction: column; touch-action: none; }
  .lb-fail { color: #f3c6c6; font-size: calc(14px * var(--fs)); text-align: center; padding: 20px; line-height: 1.7; }
  .lb-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: #e8ecf4; font-size: calc(13.5px * var(--fs)); }
  .lb-top .spacer { flex: 1 1 auto; }
  .lb-count { font-variant-numeric: tabular-nums; opacity: .8; }
  .lb-btn { background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 9px;
            padding: 8px 12px; font-size: calc(14px * var(--fs)); font-weight: 700; }
  .lb-btn:hover { background: rgba(255,255,255,.24); }
  .lb-stage { flex: 1 1 auto; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .lb-stage img { max-width: 94%; max-height: 100%; object-fit: contain; border-radius: 6px; user-select: none; -webkit-user-drag: none; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.14);
            border: none; color: #fff; font-size: calc(26px * var(--fs)); width: 46px; height: 66px; border-radius: 10px; }
  .lb-nav:hover { background: rgba(255,255,255,.28); }
  .lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; }
  .lb-nav:disabled { opacity: .2; }
  .lb-cap { padding: 10px 16px 16px; color: #cbd5e1; font-size: calc(13px * var(--fs)); text-align: center; min-height: 20px; }
  .lb-strip { display: flex; gap: 6px; padding: 0 12px 14px; overflow-x: auto; justify-content: center; }
  .lb-strip img { width: 54px; height: 54px; object-fit: cover; border-radius: 7px; opacity: .45; cursor: pointer; border: 2px solid transparent; }
  .lb-strip img.on { opacity: 1; border-color: #7d9dff; }
  @media (max-width: 700px) { .lb-nav { width: 38px; height: 56px; font-size: calc(22px * var(--fs)); } .lb-strip { display: none; } }

  /* ---------- 코드 삽입 ---------- */
  /* 삽입한 페이지는 모서리를 끌어 크기를 바꿀 수 있게 한다 */
  .embedbox { position: relative; width: 100%; margin: 0 0 6px; padding-bottom: 15px;
              resize: vertical; overflow: hidden; min-height: 120px;
              border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .embedbox > iframe.embedframe { width: 100%; height: 100%; border: none; border-radius: 10px 10px 0 0; display: block; }
  .embedhint { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin: -2px 0 10px; }
  /* 보드(카드)에서는 삽입한 페이지가 미리보기를 다 차지하지 않게 줄여 둔다.
     원래 크기로 보려면 「전체 보기」에서. */
  #list .entry .content .embedbox { max-height: 170px; }
  #list .entry .content .embedhint { display: none; }
  .embedframe { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); display: block; }
  .block.embed textarea { font-size: calc(12.5px * var(--fs)); }


  /* ---------- 엮어내기 (고른 기록 → 한 권) ---------- */
  .picklist { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .pickrow { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-bottom: 1px solid var(--line-soft);
             font-size: calc(13.5px * var(--fs)); cursor: pointer; }
  .pickrow:last-child { border-bottom: none; }
  .pickrow:hover { background: var(--panel); }
  .pickrow input { width: 17px; height: 17px; flex: 0 0 auto; }
  .pickrow .pico { flex: 0 0 auto; }
  .pickrow .pttl { flex: 1 1 auto; min-width: 0; font-weight: 600;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pickrow .pmeta { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .optrow { display: flex; align-items: flex-start; gap: 9px; padding: 7px 2px; cursor: pointer; font-size: calc(13.5px * var(--fs)); }
  .optrow input { width: 17px; height: 17px; margin-top: 2px; flex: 0 0 auto; }
  .optrow small { display: block; color: var(--ink-soft); font-size: calc(12px * var(--fs)); font-weight: 400; margin-top: 1px; }

  /* ---------- 링크 미리보기 ---------- */
  .linkcard { display: flex; gap: 10px; align-items: center; max-width: 100%;
              border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px;
              background: var(--bg); text-decoration: none; color: var(--ink); margin: 0 0 8px; }
  .linkcard:hover { border-color: var(--brand); }
  .linkcard .lc-ico { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 7px;
                      object-fit: contain; background: var(--panel); padding: 3px; }
  .linkcard .lc-body { min-width: 0; flex: 1 1 auto; }
  .linkcard .lc-title { font-size: calc(13.5px * var(--fs)); font-weight: 700; line-height: 1.4;
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linkcard .lc-host { font-size: calc(12px * var(--fs)); color: var(--ink-soft);
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linkcard .lc-thumb { width: 92px; height: 58px; flex: 0 0 auto; border-radius: 8px;
                        object-fit: cover; background: var(--line-soft); }
  @media (max-width: 700px) { .linkcard .lc-thumb { width: 68px; height: 44px; } }

  /* ---------- 전체 보기 (한 편을 통째로 읽는 화면) ---------- */
  .viewer { position: fixed; inset: 0; z-index: 140; background: var(--bg); display: flex; flex-direction: column; }
  .vtop { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
          padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .vtop .spacer { flex: 1 1 auto; }
  .vscroll { flex: 1 1 auto; overflow: auto; }
  .vpaper { max-width: 800px; margin: 24px auto 64px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 14px; padding: 36px 40px; box-shadow: var(--shadow); }
  .vpaper h1 { margin: 8px 0 10px; font-size: calc(26px * var(--fs)); line-height: 1.35; }
  .vmeta { font-size: calc(13px * var(--fs)); color: var(--ink-soft); }
  .vpaper .content { max-height: none; overflow: visible; font-size: calc(15.5px * var(--fs)); }
  .vpaper .content::after { display: none; }
  .vpaper .content figure img { max-height: none; }
  .vrel { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
  .vrel h4 { margin: 0 0 8px; font-size: calc(14px * var(--fs)); color: var(--ink-soft); }
  @media (max-width: 700px) { .vpaper { margin: 12px; padding: 22px 18px; } .vpaper h1 { font-size: calc(21px * var(--fs)); } }

  /* 인쇄 = PDF 저장. 전체 보기 화면만 종이에 남긴다 */
  @media print {
    body > *:not(#modalHost) { display: none !important; }
    #modalHost .viewer { position: static; background: #fff; }
    .vtop { display: none !important; }
    .vscroll { overflow: visible; }
    .vpaper { max-width: none; margin: 0; padding: 0; border: none; border-radius: 0; box-shadow: none; background: #fff; }
    .vpaper .content figure img { max-height: 420px; }
    .embedbox, .embedhint, .content video, .content audio { display: none !important; }
  }

  /* ---------- 보기 방식 전환 ---------- */
  .viewswitch { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .vbtn { border: none; background: transparent; color: var(--ink-soft); font-size: calc(12.5px * var(--fs)); font-weight: 700;
          padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .vbtn.on { background: var(--panel); color: var(--brand); box-shadow: 0 1px 2px rgba(20,30,60,.08); }

  /* 바둑판 · 카드 길이를 하나로 맞춘다 */
  #list.gridview { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
                   gap: 12px; align-items: stretch; }
  #list.gridview .entry { margin-bottom: 0; height: 340px; display: flex; flex-direction: column; overflow: hidden; }
  #list.gridview .head, #list.gridview .tags { flex: 0 0 auto; }
  /* 내용은 남는 높이만큼만 차지하고, 넘치면 아래로 흐리게 잘린다 */
  #list.gridview .content { flex: 1 1 auto; min-height: 0; max-height: none; overflow: hidden; position: relative; }
  #list.gridview .content.collapsed::after { display: none; }
  #list.gridview .content::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0;
                                   height: 44px; background: linear-gradient(transparent, var(--panel)); pointer-events: none; }
  #list.gridview .foot { flex: 0 0 auto; margin-top: 0; flex-wrap: nowrap; gap: 5px; }
  #list.gridview .foot .sdtxt { display: none; }        /* 좁으니 저장 상태는 아이콘만 (툴팁에 전체) */
  #list.gridview .foot .btn { padding: 7px 9px; font-size: calc(13px * var(--fs)); white-space: nowrap; }
  #list.gridview .morebtn { display: none; }
  #list.gridview .content figure img { max-height: 150px; }
  #list.gridview .rel { display: none; }
  @media (max-width: 700px) { #list.gridview { grid-template-columns: 1fr 1fr; gap: 8px; }
    #list.gridview .entry { padding: 11px; height: 290px; }
    #list.gridview .head h3 { font-size: calc(14.5px * var(--fs)); } }

  /* 목록 */
  .listview { padding: 4px; }
  .lrow { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px; }
  .lrow:hover { background: var(--bg); }
  /* 줄 사이 선 · 줄이 .lwrap 으로 한 겹 싸여 있어서 형제 선택자를 그에 맞춘다 */
  .lwrap + .lwrap > .lrow { border-top: var(--bw) solid var(--line-soft); }
  .lico { flex: 0 0 auto; font-size: calc(15px * var(--fs)); }
  .ltitle { flex: 1 1 auto; min-width: 0; text-align: left; border: none; background: transparent;
            color: var(--ink); font-size: calc(14.5px * var(--fs)); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ltitle:hover { color: var(--brand); }
  .lmeta { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .lwhen { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); width: 78px; text-align: right; }
  @media (max-width: 700px) { .lmeta { display: none; } .lwhen { width: 62px; } }

  /* ---------- 관계망 정보 패널 ---------- */
  .graphpanel {
    position: absolute; right: 10px; top: 10px; width: 260px; max-height: calc(100% - 20px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px;
  }
  .gp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .gp-title { margin: 0 0 2px; font-size: calc(15px * var(--fs)); }
  .gp-when { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin-bottom: 8px; }
  .gp-preview { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin: 0 0 10px; }
  .gp-sec { border-top: 1px solid var(--line-soft); padding-top: 8px; margin-bottom: 8px; }
  .gp-lab { font-size: calc(12px * var(--fs)); font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }
  .gp-none { font-size: calc(12px * var(--fs)); color: var(--ink-soft); opacity: .7; padding: 2px 0 4px; }
  .gp-row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
  .gp-go { flex: 1 1 auto; min-width: 0; text-align: left; border: none; background: var(--bg); color: var(--ink);
           font-size: calc(12.5px * var(--fs)); padding: 5px 8px; border-radius: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gp-go:hover { background: var(--brand-soft); color: var(--brand); }
  .gp-via { font-size: calc(12px * var(--fs)); color: var(--ink-soft); flex: 0 0 auto; }
  .gp-acts { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line-soft); padding-top: 9px; }
  .gp-acts .btn { flex: 1 1 auto; }
  .graphhint {
    position: absolute; left: 50%; transform: translateX(-50%); top: 10px; z-index: 5;
    background: #1a9e5f; color: #fff; font-size: calc(12.5px * var(--fs)); font-weight: 600;
    padding: 9px 14px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.2); max-width: 92%; text-align: center;
  }
  @media (max-width: 700px) {
    .graphpanel { right: 6px; left: 6px; width: auto; top: auto; bottom: 6px; max-height: 46%; }
    .graphhint { top: auto; bottom: 8px; font-size: calc(12px * var(--fs)); }
  }

  /* ---------- 도움말 ---------- */
  .help-block { margin-bottom: 20px; }
  .help-block h4 { margin: 0 0 7px; font-size: calc(15px * var(--fs)); }
  .help-block p { margin: 0 0 7px; font-size: calc(13.8px * var(--fs)); line-height: 1.72; }
  .help-ex {
    background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--brand);
    border-radius: 8px; padding: 10px 12px; margin: 8px 0 10px; white-space: pre-wrap;
    font-family: ui-monospace, Consolas, monospace; font-size: calc(12.5px * var(--fs)); line-height: 1.7; color: var(--ink);
  }

  /* ---------- 전체 화면 드래그&드롭 ---------- */
  .dropoverlay { position: fixed; inset: 0; z-index: 120; background: rgba(47,95,214,.18);
                 backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dropcard { background: var(--panel); border: 3px dashed var(--brand); color: var(--brand);
              border-radius: 18px; padding: 34px 46px; font-size: calc(18px * var(--fs)); font-weight: 800; text-align: center; line-height: 1.7;
              box-shadow: 0 20px 60px rgba(20,30,60,.25); }

  /* ---------- 화면 캡처 · 영역 선택 ---------- */
  .cropwrap { position: relative; display: inline-block; line-height: 0; touch-action: none;
              border-radius: 10px; overflow: hidden; border: 1px solid var(--line); cursor: crosshair; }
  .cropwrap img { display: block; max-width: 100%; max-height: 58vh; width: auto; height: auto;
                  user-select: none; -webkit-user-drag: none; }
  .cropshade { position: absolute; inset: 0; background: rgba(10,15,30,.55); pointer-events: none; }
  .cropsel { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(10,15,30,.55);
             pointer-events: none; border-radius: 2px; }
  .cropsel::after { content: ""; position: absolute; inset: -2px; border: 1px dashed var(--brand); }
  .cropsize { position: absolute; left: 0; top: -22px; font-size: calc(12px * var(--fs)); font-weight: 700; color: #fff;
              background: var(--brand); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
  .crophint { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin: 10px 0 0; }
  .modebar { display: flex; gap: 6px; justify-content: center; margin: 0 0 12px; flex-wrap: wrap; }

  /* 손 메모 판 · 손가락으로 그릴 때 화면이 같이 밀리면 안 된다 */
  /* 사진 가리기 화면 · 여러 장을 한자리에서 */
  .maskbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  .maskstrip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; }
  .maskthumb { position: relative; flex: none; padding: 0; border: 2px solid transparent;
               border-radius: 9px; background: none; cursor: pointer; line-height: 0; }
  .maskthumb.on { border-color: var(--brand); }
  .maskthumb img { width: 74px; height: 74px; object-fit: cover; border-radius: 7px;
                   background: var(--bg); display: block; }
  .maskdone { position: absolute; right: 3px; bottom: 3px; background: var(--brand); color: #fff;
              font-size: calc(12px * var(--fs)); font-weight: 700; border-radius: 20px; padding: 1px 6px; line-height: 1.5; }
  .maskstage { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
  .maskpad { display: block; max-width: 100%; max-height: 48vh; width: auto; height: auto;
             border-radius: 10px; border: 1px solid var(--line); touch-action: none; cursor: crosshair; }
  .maskghost { position: absolute; display: none; border-radius: 50%; pointer-events: none;
               border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(47,95,214,.85), 0 0 0 9999px rgba(0,0,0,0); }
  .sizedot { display: inline-block; border-radius: 50%; background: currentColor; vertical-align: middle; }

  /* 공유 전 사진 확인 · 「가리는 걸 깜빡했다」를 막는 마지막 관문 */
  .sharephotos { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 2px; }
  .sharephoto { flex: none; }
  .sharephoto img { width: 92px; height: 92px; object-fit: cover; border-radius: 8px;
                    border: 1px solid var(--line); cursor: zoom-in; display: block; background: var(--bg); }
  .checkline { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: calc(13.5px * var(--fs));
               font-weight: 700; cursor: pointer; }
  .checkline input { width: 17px; height: 17px; }
  .sharesep { font-size: calc(12.5px * var(--fs)); font-weight: 700; color: var(--ink-soft);
              border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }

  /* 밖에서 넣은 파일 이름 정리 */
  .renamebox { border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
               max-height: min(52vh, 440px); min-height: 140px; overflow: auto; margin: 10px 0 2px; }
  .renamerow { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px;
               border-bottom: 1px solid var(--line); }
  .renamerow:last-child { border-bottom: 0; }
  .renamerow > input[type=checkbox] { width: 17px; height: 17px; margin-top: 3px; flex: none; }
  .renamemid { flex: 1; min-width: 0; }
  .renamewas { font-size: calc(13.5px * var(--fs)); color: var(--ink-soft); text-decoration: line-through;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .renamemeta { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin-top: 1px; }
  .renameline { display: flex; gap: 6px; align-items: baseline; margin: 4px 0 6px; }
  .renamearrow { color: var(--brand); font-weight: 800; flex: none; }
  .renamenew { font-weight: 700; font-size: calc(13.5px * var(--fs)); word-break: break-all;
               font-family: ui-monospace, Consolas, monospace; }

  /* 폴더 구조 · 탐색기처럼 위에서 아래로 */
  /* 창이 낮아도 트리가 뭉개지지 않게 최소 높이를 준다. 모자라면 모달 쪽이 스크롤한다. */
  .treebox { border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
             max-height: min(58vh, 480px); min-height: 180px; overflow: auto; margin: 0 0 2px; padding: 6px 0; }
  .trow { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px;
          font-size: calc(13.5px * var(--fs)); line-height: 1.45; white-space: nowrap; border-radius: 6px; }
  .trow.tfolder, .trow.tclick { cursor: pointer; }
  .trow.tfolder:hover, .trow.tclick:hover { background: var(--panel); }
  .trow.tfolder .tname { font-weight: 700; }
  .trow.tpending .tname { color: var(--ink-soft); }
  .tcaret { width: 12px; flex: none; color: var(--ink-soft); font-size: calc(12px * var(--fs)); text-align: center; }
  .ticon { flex: none; }
  .tname { overflow: hidden; text-overflow: ellipsis; }
  .tmeta { margin-left: auto; padding-left: 12px; flex: none;
           font-size: calc(12px * var(--fs)); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* 녹음 화면 · 숫자와 막대가 «지금 담기고 있다» 를 말해 준다 */
  .voiceclock { font-size: calc(40px * var(--fs)); font-weight: 800; letter-spacing: 1px; margin: 4px 0 10px;
                font-variant-numeric: tabular-nums; }
  .voicemeter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden;
                margin: 0 auto 10px; max-width: 420px; }
  .voicebar { height: 100%; width: 0; background: var(--brand); border-radius: 99px; transition: width .08s linear; }

  .drawwrap { width: 100%; display: flex; justify-content: center; }
  .drawpad { display: block; margin: 0 auto; background: #fff; border: 1px solid var(--line);
             border-radius: 10px; touch-action: none; cursor: crosshair; }

  /* 웹캠 미리보기 · 규칙이 없으면 1920x1080 원본이 그대로 나와 모달을 뚫는다 */
  .camview { display: block; width: 100%; height: auto; max-width: 100%; max-height: 58vh;
             object-fit: contain; background: #000; border-radius: 10px; border: 1px solid var(--line); }
  @media (max-width: 700px) { .camview { max-height: 52vh; } }

  /* ---------- 선택 시트 (사진 넣는 방법 고르기) ---------- */
  .sheet .mbody { padding: 14px 18px 18px; }
  .sheetbtn {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; font-weight: 700; font-size: calc(15px * var(--fs));
  }
  .sheetbtn:hover { border-color: var(--brand); color: var(--brand); }
  .sheetbtn .em { font-size: calc(24px * var(--fs)); line-height: 1; flex: 0 0 auto; }
  .sheetbtn small { display: block; font-weight: 500; font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin-top: 2px; }
  .sheetbtn:hover small { color: inherit; }
  .sheetnote { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); background: var(--bg);
               border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
  .sheettoggle { display: flex; align-items: center; gap: 8px; font-size: calc(13.5px * var(--fs)); padding: 4px 2px; }

  /* ---------- 동기화 표시 ---------- */
  .syncpill { font-size: calc(12px * var(--fs)); color: var(--ink-soft); white-space: nowrap; }
  .syncpill.busy { color: var(--brand); }

  /* ---------- 모바일 ---------- */
  @media (max-width: 700px) {
    /* iOS 가 입력칸에서 자동 확대하지 않도록 16px 이상 유지 */
    .inp, input, textarea, select { font-size: calc(16px * var(--fs)); }
    .wrap { padding: 0 12px 96px; }
    .top-inner { padding: 8px 12px; gap: 7px; }
    .acct { display: none; }
    .btn { padding: 9px 13px; }
    .btn.sm { padding: 8px 11px; font-size: calc(13.5px * var(--fs)); }
    .btn.xs { padding: 6px 10px; font-size: calc(13px * var(--fs)); }
    .composer, .entry { padding: 14px; }
    .grid2 { gap: 8px; }
    .addbar { position: sticky; bottom: 0; z-index: 20; background: var(--panel);
              box-shadow: 0 -6px 18px rgba(20,30,60,.08); }
    .addbar .btn { flex: 1 1 30%; text-align: center; }
    .addhint { font-size: calc(12px * var(--fs)); }
    .bhead .btn.xs { min-width: 40px; }
    .media .thumb, .media .ficon { width: 72px; height: 72px; }
    .toolbar .search { flex: 1 1 100%; max-width: none; order: 9; }
    .modal-bg { padding: 0; align-items: flex-end; }
    .modal { max-width: none; max-height: 92vh; border-radius: 16px 16px 0 0; }
    .graphmodal { height: 92vh; max-width: none; }
    .graphtools .inp { width: 110px; }
    .graphlegend { display: none; }
    .modal .mhead, .modal .mfoot { padding: 13px 14px; }
    .modal .mbody { padding: 14px; }
    .tabs { padding: 8px 12px 0; }
    .tab { padding: 8px 10px; font-size: calc(13px * var(--fs)); }
    .typerow { flex-wrap: wrap; }
    .typerow .nm { flex: 1 1 120px; }
    .cropwrap { max-width: 100%; }
    .dropcard { padding: 24px 28px; font-size: calc(16px * var(--fs)); }
  }

  footer.site { text-align: center; color: var(--ink-soft); font-size: calc(12.5px * var(--fs)); padding: 30px 0 10px; }
  footer.site a { color: var(--ink-soft); }
  /* 태그가 «나중에 이어 주는 실» 이라는 것을 적는 자리 */
  .taghint { margin: 7px 0 0; font-size: calc(12.5px * var(--fs)); line-height: 1.7; color: var(--ink-soft); }
  .taghint b { color: var(--ink); }
</style>
</head>
<body>

<div id="progress"></div>

<header class="top">
  <div class="top-inner">
    <!-- 줄 셋 · 폰에서만 보인다. 누르면 폴더 구조 서랍이 왼쪽에서 나온다 -->
    <button id="btnDrawer" class="burgerbtn" aria-label="폴더 구조 열기"><i></i><i></i><i></i></button>
    <!-- 로고도 그림글자 대신 브릭 한 조각 · 이 도구의 정체성이다 -->
    <div class="logo"><svg class="logomark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9.5" width="18" height="10" rx="2.5"/><path d="M7 9.5V6.8h4v2.7M13 9.5V6.8h4v2.7"/></svg> 구글 기록장 <small>TRACE · 개인 지식·경험 관리 체계</small></div>
    <div class="spacer"></div>
    <span id="syncPill" class="syncpill"></span>
    <span id="acct" class="acct"></span>
    <!-- 그림글자 대신 선 아이콘 · 이모지는 색이 우리 색을 안 따라와서 판 위에서 안 읽힌다 -->
    <button id="btnHelp" class="btn sm" title="연결·백링크·관계망 사용법"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 1 1 3.6 2.6c-.8.3-1 .9-1 1.9"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/></svg></button>
    <button id="btnInstall" class="btn sm" style="display:none" title="이 기록장을 내 컴퓨터에 앱으로 설치합니다"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="m7.5 10.5 4.5 4 4.5-4"/><path d="M5 19.5h14"/></svg><span class="lbl"> 앱으로 설치</span></button>
    <button id="btnMap" class="btn sm" title="폴더 구조"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20v-14h6l2 2.5h10V20Z"/></svg><span class="lbl"> 폴더 구조</span></button>
    <button id="btnGraph" class="btn sm" title="관계망"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="2.4"/><circle cx="5.5" cy="17.5" r="2.4"/><circle cx="18.5" cy="17.5" r="2.4"/><path d="M10.9 7.6 6.7 15.4M13.1 7.6l4.2 7.8M7.9 17.5h8.2"/></svg><span class="lbl"> 관계망</span></button>
    <button id="btnSettings" class="btn sm" title="설정"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h9"/><circle cx="16.5" cy="7.5" r="2.4"/><path d="M20 16.5h-9"/><circle cx="7.5" cy="16.5" r="2.4"/></svg><span class="lbl"> 설정</span></button>
    <button id="btnLogin" class="btn sm primary">구글 로그인</button>
  </div>
</header>

<!-- 왼쪽 · 폴더 구조. PC 에서는 늘 보이고, 폰에서는 줄 셋(☰)으로 여는 서랍이 된다 -->
<div class="layout">
<aside id="sideNav" aria-label="폴더 구조"></aside>
<div id="drawerScrim" class="hidden"></div>

<div class="wrap">

  <div id="banner" class="banner warn"></div>

  <!-- ================= 에디터 ================= -->
  <div id="draftBar" class="banner draft hidden"></div>

  <section class="card composer" id="composer">
    <!-- 접혔을 때 남는 한 줄. 폴더를 보는 동안은 이것만 보인다 -->
    <div class="cfold">
      <button type="button" class="cfoldbtn" id="btnUnfold">＋ 새 기록</button>
      <span class="cfoldwhere" id="cfoldWhere"></span>
    </div>
    <h2 id="composerTitle">✍️ 새 기록</h2>
    <!-- 이 기록이 갈 자리. 쓰기 전에 보여야 한다 · 쓰고 나서 알면 늦다 -->
    <div id="deskLine" class="deskline hidden"></div>

    <div class="chips" id="typeChips" style="margin-bottom:12px;"></div>

    <div class="grid2">
      <div class="field" style="margin-bottom:12px;">
        <label for="title">제목</label>
        <input id="title" class="inp" placeholder="무엇에 대한 기록인가요?" />
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label for="tags">태그 <span style="font-weight:400;color:var(--ink-soft)">(쉼표로 구분)</span></label>
        <input id="tags" class="inp" placeholder="수업, 에듀테크, 회고" />
        <!-- 태그를 «지금 나누는 일» 로만 여기면 대충 적게 된다.
             나중에 그것이 «이어 주는 실» 이 된다는 것을 여기서 한 줄로 알려 준다. -->
        <p class="taghint">
          같은 태그끼리 모아 보고, 관계망에서 한 덩어리로 묶입니다.
        </p>
      </div>
    </div>

    <div class="field">
      <label>내용</label>
      <div id="maskBar" class="maskbar hidden">
        <button id="btnMaskAll" class="btn sm">🔲 사진 가리기</button>
        <span class="addhint" id="maskBarHint"></span>
      </div>
      <div id="blocks"></div>
      <!-- ＋ 를 단추마다 붙이면 열한 번 되풀이된다. 앞에 크게 하나만 세우면
           «이 아래는 다 넣는 것» 이라고 한 번에 읽힌다. 자리도 그만큼 넓어진다. -->
      <div class="addbar" id="addbar">
        <div class="addlead"><span class="addplus">＋</span><span class="addlabel">넣기</span></div>
        <button class="btn sm" data-add="heading">소제목</button>
        <button class="btn sm" data-add="text">글</button>
        <button class="btn sm" data-add="quote">인용</button>
        <button class="btn sm" data-add="capture">캡처</button>
        <button class="btn sm" data-add="image">사진</button>
        <button class="btn sm" data-add="draw">손 메모</button>
        <button class="btn sm" data-add="voice">녹음</button>
        <button class="btn sm" data-add="file">파일·영상</button>
        <button class="btn sm" data-add="link">링크</button>
        <button class="btn sm" data-add="embed">코드 삽입</button>
        <button class="btn sm" data-add="divider">구분선</button>
      </div>
      <input type="file" id="fileInput" multiple class="hidden" />
      <input type="file" id="imgInput" accept="image/*" multiple class="hidden" />
      <input type="file" id="cropPickInput" accept="image/*" class="hidden" />
      <!-- 카메라 입력칸은 실제로 누를 때만 만든다 (상주시키면 브라우저가 카메라 요청으로 오해) -->
    </div>

    <div class="composer-actions">
      <button id="btnSave" class="btn primary">기록 저장</button>
      <button id="btnCancelEdit" class="btn ghost hidden">편집 취소</button>
      <span class="spacer"></span>
      <span class="savehint">Ctrl+Enter 로 저장</span>
    </div>
  </section>

  <!-- ================= 목록 ================= -->
  <div class="toolbar">
    <h2>📚 기록</h2>
    <span class="count" id="countText"></span>
    <span class="spacer"></span>
    <div class="viewswitch" id="viewSwitch"></div>
    <button id="btnCompile" class="btn sm" title="고른 기록을 한 권으로 묶어 내려받습니다">📚 엮어내기</button>
