     구글이 주는 토큰은 1시간짜리다. 예전에는 자바스크립트 변수에만 담아서
     «새로고침 = 로그아웃» 이었다. 특히 폰에서 앱으로 설치해 쓰면
     조용히 다시 받는 길(계정 쿠키)이 막혀 있어서 매번 풀렸다.
     이제 만료시각까지 담아 두고, 남은 시간이 있으면 그대로 이어 쓴다.
     ⚠️ 로그아웃하면 반드시 지운다. 이건 드라이브를 열 수 있는 열쇠다. */
  function saveToken(tok, expiresIn) {
    try {
      var life = Number(expiresIn || 3600);
      localStorage.setItem(LS.token, JSON.stringify({ t: tok, exp: Date.now() + (life - 120) * 1000 }));
    } catch (e) { /* 저장 못 해도 이번 판은 쓸 수 있다 */ }
  }
  function loadToken() {
    var s = safeParse(localStorage.getItem(LS.token));
    return (s && s.t && s.exp > Date.now()) ? s.t : null;
  }
  function clearToken() {
    accessToken = null;
    try { localStorage.removeItem(LS.token); } catch (e) {}
  }
  function rememberEmail() {
    try { if (userEmail) localStorage.setItem(LS.email, userEmail); } catch (e) {}
  }

  function requestToken(interactive) {
    return new Promise(function (resolve, reject) {
      if (!tokenClient && !initTokenClient()) { reject(new Error("구글 로그인 준비 중입니다. 잠시 후 다시 눌러 주세요.")); return; }
      tokenClient.callback = function (r) {
        if (r && r.error) { reject(new Error(r.error_description || r.error)); return; }
        accessToken = r.access_token;
        saveToken(r.access_token, r.expires_in);
        needReconnect = false;
        resolve(accessToken);
      };
      var cfg = { prompt: interactive ? "consent" : "" };
      // 전에 쓰던 계정을 알려 주면 «계정 고르기» 화면을 건너뛴다 (조용히 받을 확률도 올라간다)
      var hint = localStorage.getItem(LS.email);
      if (hint) cfg.hint = hint;
      try { tokenClient.requestAccessToken(cfg); }
      catch (e) { reject(e); }
    });
  }

  /* ---- 「방금 눌렀는가」 를 기억한다 ----
     구글 토큰 라이브러리는 «조용히 받기» 라는 길이 없다. 부르면 무조건 팝업을 연다.
     사용자가 아무것도 안 눌렀는데 팝업을 열면 브라우저가 «내가 안 시킨 창» 으로 보고 막는다.
     ← 폰에서 로그인이 풀린 것처럼 보이던 진짜 이유가 이것이다.
     그래서 «최근에 누른 적이 있을 때만» 부르고, 아니면 «다시 연결» 띠로 넘긴다. */
  var lastGestureAt = 0;
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
    document.addEventListener(ev, function () { lastGestureAt = Date.now(); }, true);
  });
  function canOpenPopup() { return Date.now() - lastGestureAt < 60000; }

  /* 조용히 다시 받아 본다. 실패하면 «다시 연결» 띠를 띄우고 조용히 물러난다.
     예전에는 실패해도 아무 말이 없어서 «그냥 로그아웃된 것»처럼 보였다. */
  function renewQuietly() {
    if (!canOpenPopup()) {
      needReconnect = true; clearToken(); updateChrome();
      return Promise.reject(new Error("연결이 풀렸습니다. 위쪽 [다시 연결] 을 눌러 주세요."));
    }
    return requestToken(false).catch(function (e) {
      needReconnect = true;
      clearToken();
      updateChrome();
      throw e;
    });
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  // 구글이 «잠깐 쉬어라»(429·5xx·사용량 초과) 라고 하면 기다렸다 다시 건다
  function shouldBackoff(res) {
    if (res.status === 429 || res.status >= 500) return true;
    return false;
  }
  function driveFetch(url, opts, tried) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "Bearer " + accessToken;
    tried = tried || 0;
    return fetch(url, opts).then(function (res) {
      if (res.status === 401 && tried === 0) {
        return renewQuietly().then(function () { return driveFetch(url, opts, 1); });
      }
      if (shouldBackoff(res) && tried < 4) {
        return sleep(Math.min(8000, 500 * Math.pow(2, tried)) + Math.random() * 400)
          .then(function () { return driveFetch(url, opts, tried + 1); });
      }
      return res;
    });
  }
  function driveJson(url, opts) {
    return driveFetch(url, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.error && j.error.message) || ("HTTP " + r.status));
        return j;
      });
    });
  }
  /* 「다시 연결」 한 번 눌러 되살리기.
     조용히 받아 보고, 안 되면 그때만 구글 화면을 띄운다. */
  function reconnect() {
    needReconnect = false; updateChrome();
    return requestToken(false)
      .catch(function () { return requestToken(true); })
      .then(function () { return connect(); })
      .catch(function (e) {
        needReconnect = true; updateChrome();
        toast("다시 연결하지 못했습니다: " + errText(e));
      });
  }
  function ensureAccount() {
    return driveFetch("https://www.googleapis.com/oauth2/v3/userinfo")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (i) { if (i && i.email) { userEmail = i.email; rememberEmail(); } })
      .catch(function () {});
  }

  /* =========================================================
     4. 드라이브 기본 동작
     ========================================================= */
  function parseFolderId(input) {
    var s = String(input || "").trim();
    if (!s) return "";
    var m = /\/folders\/([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    m = /[?&]id=([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    m = /\/d\/([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    if (/^[A-Za-z0-9_-]{10,}$/.test(s)) return s;
    return "";
  }
  function verifyFolder(id) {
    return driveJson("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(id) +
      "?fields=id,name,mimeType,webViewLink&supportsAllDrives=true").then(function (f) {
        if (f.mimeType !== "application/vnd.google-apps.folder") throw new Error("폴더가 아닙니다. 폴더 링크를 넣어 주세요.");
        return { id: f.id, name: f.name, link: f.webViewLink };
      });
  }
  function qEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

  function findInFolder(name, parentId) {
    var q = "name='" + qEsc(name) + "' and '" + parentId + "' in parents and trashed=false";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) { return (j.files && j.files.length) ? j.files[0].id : null; });
  }
  function createFolder(name, parentId) {
    return driveJson("https://www.googleapis.com/drive/v3/files?fields=id,name&supportsAllDrives=true", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, mimeType: "application/vnd.google-apps.folder", parents: [parentId] })
    });
  }
  // 이름이 같은 폴더가 있으면 재사용하고, 없으면 만든다
  var folderCache = {};
  function ensureNamedFolder(name, parentId) {
    var key = parentId + "/" + name;
    if (folderCache[key]) return Promise.resolve(folderCache[key]);
    return findInFolder(name, parentId).then(function (id) {
      if (id) { folderCache[key] = id; return id; }
      return createFolder(name, parentId).then(function (f) { folderCache[key] = f.id; return f.id; });
    });
  }
  // 이미 올라간 파일을 다른 폴더로 옮긴다
  function moveToParent(fileId, newParent) {
    if (!fileId || !newParent) return Promise.resolve();
    return driveJson("https://www.googleapis.com/drive/v3/files/" + fileId + "?fields=parents&supportsAllDrives=true")
      .then(function (f) {
        var prev = (f.parents || []).join(",");
        if (prev === newParent) return null;
        return driveJson("https://www.googleapis.com/drive/v3/files/" + fileId +
          "?addParents=" + newParent + (prev ? "&removeParents=" + prev : "") +
          "&fields=id&supportsAllDrives=true", { method: "PATCH" });
      }).catch(function () {});
  }

  // 이 기록의 .md 와 자료가 들어갈 폴더를 정한다
  function entryFolderName(n) {
    return applyPattern(settings.folderPattern, nameContext(n, 1, "", ""));
  }
  /* 이 기록이 골라 둔 자리의 진짜 폴더 ID.
     id 를 이미 알면 그대로, 이름길만 알면 뿌리부터 한 칸씩 내려가 찾는다(없으면 만든다).
     못 찾으면 null 을 준다 · 그러면 아래에서 «정리 방식대로» 로 되돌아간다.
     기록이 저장 못 되는 일은 없어야 한다. */
  function ensureEntryDesk(n) {
    if (n.deskId) return Promise.resolve(n.deskId);
    var path = (n.deskPath || []).filter(Boolean);
    if (!path.length || !folder.id) return Promise.resolve(null);
    return path.reduce(function (chain, nm) {
      return chain.then(function (pid) { return ensureNamedFolder(safeName(nm, 60), pid); });
    }, Promise.resolve(folder.id))
      .then(function (id) { if (id) { n.deskId = id; n._dirty = true; } return id || null; })
      .catch(function () { return null; });
  }
  function resolveTargets(n) {
    var mode = settings.folderMode;
    /* 사람이 고른 자리가 맨 앞이다.
       「부기 사업」 폴더를 골라 놓고 저장했는데 태그 폴더로 끌려가면, 고른 뜻이 없어진다.
       ⚠️ 여기서도 folderId 는 건드리지 않는다. 지우기가 따라오면 안 되는 자리다. */
    if (n.deskId || (n.deskPath && n.deskPath.length)) {
      return ensureEntryDesk(n).then(function (did) {
        if (!did) return byMode(n);
        if (mode === "materials") {
          return ensureNamedFolder(settings.materialsFolderName || "자료", did)
            .then(function (sub) { return { md: did, file: sub }; })
            .catch(function () { return { md: did, file: did }; });
        }
        return { md: did, file: did };
      });
    }
    return byMode(n);
  }
  function byMode(n) {
    var mode = settings.folderMode;
    if (mode === "flat") return Promise.resolve({ md: folder.id, file: folder.id });
    if (mode === "materials") {
      return ensureNamedFolder(settings.materialsFolderName || "자료", folder.id)
        .then(function (sub) { return { md: folder.id, file: sub }; });
    }
    if (mode === "monthly") {
      var m = dateStamp(n.createdAt).slice(0, 7);
      return ensureNamedFolder(m, folder.id).then(function (id) { return { md: id, file: id }; });
    }
    /* 태그가 곧 폴더.
       드라이브는 «파일 하나가 폴더 하나» 다 (2020년에 여러 폴더 두기가 없어졌다).
       그래서 첫 태그를 진짜 자리로 삼고, 나머지 태그 폴더에는 «바로가기» 를 놓는다. */
    if (mode === "tag") {
      return ensureNamedFolder(primaryTagFolder(n), folder.id)
        .then(function (id) { return { md: id, file: id }; });
    }
    // perEntry · 기록마다 폴더 하나
    if (n.folderId) return Promise.resolve({ md: n.folderId, file: n.folderId, existing: true });
    var want = entryFolderName(n);
    return uniqueName(want, folder.id)
      .then(function (nm) { return createFolder(nm, folder.id); })
      .then(function (f) {
        n.folderId = f.id; n.folderName = f.name; n._dirty = true;
        return { md: f.id, file: f.id, created: true };
      });
  }
  var NO_TAG_FOLDER = "태그없음";
  function primaryTagFolder(n) {
    var t = (n.tags || []).filter(Boolean)[0];
    return t ? safeName(String(t), 60) : NO_TAG_FOLDER;
  }
  /* 두 번째 태그부터는 그 태그 폴더에 «바로가기» 를 놓는다.
     드라이브 바로가기는 진짜 파일을 가리키는 표지판이라, 사본이 늘지 않는다.
     이미 같은 이름이 있으면 그냥 둔다. 여러 번 저장해도 쌓이지 않게. */
  function createShortcut(name, parentId, targetId) {
    return driveJson("https://www.googleapis.com/drive/v3/files?fields=id&supportsAllDrives=true", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: name, mimeType: "application/vnd.google-apps.shortcut",
        parents: [parentId], shortcutDetails: { targetId: targetId }
      })
    });
  }
  function syncTagShortcuts(n) {
    if (settings.folderMode !== "tag" || !n.mdId) return Promise.resolve();
    var tags = (n.tags || []).filter(Boolean).map(function (t) { return safeName(String(t), 60); });
    /* 보통은 첫 태그 폴더가 «진짜 자리» 라 거기엔 바로가기를 안 놓는다.
       그런데 자리를 손으로 골라 쓴 기록은 진짜 파일이 그 자리에 있으므로,
       첫 태그 폴더에도 표지판이 있어야 «태그가 곧 폴더» 라는 약속이 안 깨진다. */
    var extra = (n.deskId ? tags : tags.slice(1)).filter(function (t, i, a) { return t && a.indexOf(t) === i; });
    if (!extra.length) return Promise.resolve();
    var linkName = n.mdName || (stemOf(mdName(n)) + ".md");
    return extra.reduce(function (chain, tag) {
      return chain.then(function () {
        return ensureNamedFolder(tag, folder.id).then(function (fid) {
          return findInFolder(linkName, fid).then(function (found) {
            if (found) return null;
            return createShortcut(linkName, fid, n.mdId);
          });
        });
      }).catch(function (e) { console.warn("태그 바로가기 실패", tag, e); });
    }, Promise.resolve());
  }

  // 폴더 방식을 바꿨거나 새로 폴더가 생겼으면, 기존 파일도 그리로 옮긴다
  /* ⚠️ 폴더에서 끌어온 것(srcId)은 제자리에 둔다 · 글도, 자료도.
     십삼 년 동안 있던 자리에서 끌어내면 그 폴더를 쓰던 다른 길이 다 끊긴다.
     「기존 파일도 새 방식으로 옮기기」 를 누른 사람이 바라는 것은
     «내가 앱으로 만든 것들을 새 방식대로 다시 담아라» 이지,
     «십삼 년치 원본을 기록마다 폴더로 흩어라» 가 아니다.
     밖에서 온 것의 자리는 사람이 드라이브에서 정한다. */
  function relocateEntryFiles(n, t) {
    if (n.srcId) return Promise.resolve();
    var jobs = [];
    if (n.mdId) jobs.push(moveToParent(n.mdId, t.md));
    (n.blocks || []).forEach(function (b) {
      if (b.fileId) jobs.push(moveToParent(b.fileId, t.file));
    });
    return Promise.all(jobs);
  }
  /* mediaType 을 따로 주면 "저장될 형식"과 "올리는 본문 형식"을 다르게 할 수 있다.
     예: 구글 문서로 변환 저장 → mimeType=google-apps.document, mediaType=text/html
     ⚠️ 이미 있는 파일에 name 을 «안 주면» 드라이브의 이름을 그대로 둔다.
        사람이 드라이브에서 붙인 이름을 저장 한 번에 되돌려 놓지 않으려는 것이다. */
  function uploadFile(name, mimeType, payload, isBase64, fileId, parentId, mediaType) {
    var media = mediaType || mimeType;
    var boundary = "trace" + Math.random().toString(36).slice(2);
    var d = "\r\n--" + boundary + "\r\n", c = "\r\n--" + boundary + "--";
    var meta = fileId ? (name ? { name: name } : {}) : { name: name, mimeType: mimeType, parents: [parentId || folder.id] };
    var body = d + "Content-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
      d + "Content-Type: " + media + "\r\n" + (isBase64 ? "Content-Transfer-Encoding: base64\r\n" : "") + "\r\n" +
      payload + c;
    var url = "https://www.googleapis.com/upload/drive/v3/files" + (fileId ? "/" + fileId : "") +
      "?uploadType=multipart&fields=id,name&supportsAllDrives=true";
    return driveJson(url, {
      method: fileId ? "PATCH" : "POST",
      headers: { "Content-Type": 'multipart/related; boundary="' + boundary + '"' },
      body: body
    });
  }
  /* ---- 화면이 꺼지지 않게 붙잡아 둔다 ----
     폰은 화면이 꺼지면 브라우저를 얼려서 업로드가 그 자리에 멈춘다.
     올리는 동안만 깨워 두고, 끝나면 바로 놓아 준다. */
  var wakeLock = null, wakeHolders = 0;
  function keepAwake() {
    wakeHolders++;
    if (wakeLock || !navigator.wakeLock) return;
    navigator.wakeLock.request("screen")
      .then(function (w) {
        if (!wakeHolders) { w.release(); return; }
        wakeLock = w;
        w.addEventListener("release", function () { wakeLock = null; });
      })
      .catch(function () { /* 못 잡아도 업로드는 그대로 한다 */ });
  }
  function releaseAwake() {
    wakeHolders = Math.max(0, wakeHolders - 1);
    if (wakeHolders === 0 && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  // 화면이 다시 켜지면 잠금이 풀려 있다. 아직 올리는 중이면 다시 잡는다.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && wakeHolders > 0 && !wakeLock && navigator.wakeLock) {
      navigator.wakeLock.request("screen").then(function (w) { wakeLock = w; }).catch(function () {});
    }
  });

  /* ---- 큰 파일용: 조각내어 올리는 업로드 ----
     base64 로 통째로 만들면 200MB 파일에서 브라우저가 죽습니다.
     Blob 을 그대로 끊어 보냅니다.                       */
  function uploadBlob(name, mime, blob, parentId, fileId, onProgress) {
    var meta = fileId ? { name: name } : { name: name, mimeType: mime || "application/octet-stream", parents: [parentId] };
    var url = "https://www.googleapis.com/upload/drive/v3/files" + (fileId ? "/" + fileId : "") +
      "?uploadType=resumable&fields=id,name&supportsAllDrives=true";
    return driveFetch(url, {
      method: fileId ? "PATCH" : "POST",
      headers: { "Content-Type": "application/json; charset=UTF-8" },
      body: JSON.stringify(meta)
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          var why = "";
          try { var j = JSON.parse(t); why = (j.error && j.error.message) || ""; } catch (e) {}
          throw new Error("업로드 시작 실패 (" + res.status + (why ? " · " + why : "") + ")");
        });
      }
      var loc = res.headers.get("Location") || res.headers.get("location");
      if (!loc) throw new Error("NO_LOCATION");
      keepAwake();
      return putChunks(loc, blob, onProgress)
        .then(function (r) { releaseAwake(); return r; },
              function (e) { releaseAwake(); throw e; });
    });
  }

  /* ---- 조각 하나를 보낸다 ----
     ⚠️ fetch 가 아니라 XMLHttpRequest 를 쓴다. fetch 는 «올라가는 중» 진행률을
        알려줄 방법이 아예 없어서, 조각 하나가 끝날 때까지 화면이 멈춰 보였다.
        폰에서 8MB 한 조각은 20~60초다. 그동안 0% 에 붙어 있었던 것.
     또 하나: 신호가 끊기면 요청이 오류도 없이 영원히 매달린다.
        일정 시간 아무 바이트도 안 올라가면 끊고 다시 건다. */
  function putChunk(sessionUrl, body, contentRange, onBytes) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest(), timer = null, dead = false;
      function arm() {
        clearTimeout(timer);
        timer = setTimeout(function () { dead = true; try { xhr.abort(); } catch (e) {} }, STALL_MS);
      }
      function done() { clearTimeout(timer); }
      xhr.open("PUT", sessionUrl, true);
      xhr.setRequestHeader("Authorization", "Bearer " + accessToken);
      xhr.setRequestHeader("Content-Range", contentRange);
      if (xhr.upload) {
        xhr.upload.onprogress = function (e) {
          arm();                                   // 올라가고 있으면 시계를 다시 감는다
          if (e.lengthComputable && onBytes) onBytes(e.loaded);
        };
      }
      xhr.onload = function () {
        done();
        resolve({
          status: xhr.status,
          range: xhr.getResponseHeader("Range") || xhr.getResponseHeader("range") || "",
          text: xhr.responseText || ""
        });
      };
      xhr.onerror = function () { done(); reject(new Error("NET")); };
      xhr.onabort = function () { done(); reject(new Error(dead ? "STALL" : "ABORT")); };
      arm();
      xhr.send(body);
    });
  }

  function putChunks(sessionUrl, blob, onProgress) {
    var total = blob.size;
    // 폰에서는 조각을 작게 쪼갠다. 신호가 나빠 한 조각이 통째로 날아가는 손해를 줄인다.
    var chunk = isTouchDevice() ? MOBILE_CHUNK : RESUMABLE_CHUNK;
    if (!total) {
      return putChunk(sessionUrl, null, "bytes */0", null).then(function (r) { return safeParse(r.text) || {}; });
    }
    var report = function (bytes) { if (onProgress) onProgress(Math.min(1, bytes / total)); };

    // 서버에게 «어디까지 받았느냐» 고 물어본다. 끊겼던 자리를 정확히 찾아 거기서 잇는다.
    function askPosition() {
      return putChunk(sessionUrl, null, "bytes */" + total, null).then(function (r) {
        if (r.status === 200 || r.status === 201) return { finished: safeParse(r.text) || {} };
        if (r.status === 308) {
          var m = /(\d+)\s*$/.exec(r.range || "");
          return { at: m ? Number(m[1]) + 1 : 0 };
        }
        if (r.status === 404) throw new Error("업로드 자리가 만료됐습니다. [동기화] 를 다시 눌러 주세요.");
        throw new Error("업로드 상태 확인 실패 (" + r.status + ")");
      });
    }

    function why(text, status) {
      var m = "";
      try { var j = JSON.parse(text); m = (j.error && j.error.message) || ""; } catch (e) {}
      return "업로드 실패 (" + status + (m ? " · " + m : "") + ")";
    }

    // start 부터 이어 보낸다. fails 는 «연달아» 실패한 횟수 · 나아가면 0 으로 되돌린다.
    function step(start, fails) {
      var end = Math.min(start + chunk, total);
      return putChunk(sessionUrl, blob.slice(start, end), "bytes " + start + "-" + (end - 1) + "/" + total,
        function (loaded) { report(start + loaded); })
        .then(function (r) {
          if (r.status === 308) {
            var m = /(\d+)\s*$/.exec(r.range || "");
            var next = m ? Number(m[1]) + 1 : end;
            report(next);
            return next >= total ? askPosition().then(function (p) { return p.finished || {}; }) : step(next, 0);
          }
          if (r.status === 200 || r.status === 201) { report(total); return safeParse(r.text) || {}; }
          if (r.status === 401) {
            return renewQuietly().then(function () { return step(start, fails); });
          }
          // 429·5xx·사용량 초과 · 기다렸다 «받은 데까지» 확인하고 이어 붙인다
          if (r.status === 429 || r.status >= 500 || (r.status === 403 && /rate|quota|limit/i.test(r.text))) {
            if (fails >= MAX_UPLOAD_RETRY) throw new Error(why(r.text, r.status));
            return waitThenResume(fails);
          }
          throw new Error(why(r.text, r.status));
        })
        .catch(function (e) {
          // 끊김·멈춤은 «실패» 가 아니라 «다시 붙이면 되는 일» 이다
          var soft = e && (e.message === "NET" || e.message === "STALL" || e.message === "ABORT");
          if (!soft || fails >= MAX_UPLOAD_RETRY) {
            if (soft) throw new Error("연결이 끊겨 업로드를 잇지 못했습니다. [동기화] 를 다시 눌러 주세요.");
            throw e;
          }
          return waitThenResume(fails);
        });

      function waitThenResume(n) {
        var wait = Math.min(15000, 800 * Math.pow(2, n)) + Math.random() * 500;
        if (onProgress) onProgress(-1);   // «잠시 기다리는 중» 표시
        return sleep(wait)
          .then(waitOnline)
          .then(askPosition)
          .then(function (p) {
            if (p.finished) { report(total); return p.finished; }
            report(p.at);
            return step(p.at, n + 1);
          });
      }
    }

    // 비행기 모드·지하철처럼 아예 끊긴 상태면, 돌아올 때까지 기다렸다 잇는다
    function waitOnline() {
      if (navigator.onLine !== false) return Promise.resolve();
      return new Promise(function (res) {
        var t = setTimeout(go, 20000);
        function go() { clearTimeout(t); window.removeEventListener("online", go); res(); }
        window.addEventListener("online", go);
      });
    }

    return askPosition().then(function (p) {
      if (p.finished) { report(total); return p.finished; }
      return step(p.at || 0, 0);
    });
  }
  // 오류를 사람이 읽을 수 있는 한 줄로 · ProgressEvent 처럼 message 가 없는 것도 있다
  function errText(e) {
    if (!e) return "알 수 없는 오류";
    if (typeof e === "string") return e;
    if (e.message) return e.message;
    if (e.name) return e.name;
    if (typeof ProgressEvent !== "undefined" && e instanceof ProgressEvent) {
      var t = e.target || {};
      if (t.error && t.error.name) return "파일 본문을 읽지 못했습니다 (" + t.error.name + ")";
      return "파일 본문을 읽지 못했습니다";
    }
    return String(e);
  }

  // 조각 업로드가 막히면(사내망 등) 작은 파일은 예전 방식으로 올려 본다
  function blobToBase64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(b64of(r.result)); };
      r.onerror = function (ev) {
        var err = (r.error && r.error.name) ? r.error.name : "읽기 실패";
        rej(new Error("파일 본문을 읽지 못했습니다 (" + err + ")"));
      };
      r.readAsDataURL(blob);
    });
  }
  function uploadAttachment(b, parentId, onProgress) {
    var mime = b.mime || "application/octet-stream";
    return uploadBlob(b.name, mime, b.blob, parentId, null, onProgress)
      .catch(function (e) {
        // 예전 방식은 파일을 통째로 base64 로 부풀린다(1.4배). 폰에서는 그것만으로 브라우저가 죽어서
        // 한도를 훨씬 낮게 잡는다. 여기까지 왔다는 건 이미 여러 번 이어 붙이기를 시도한 뒤다.
        var lastResortMax = (isTouchDevice() ? 4 : 25) * 1024 * 1024;
        if (b.blob.size > lastResortMax) throw e;
        console.warn("조각 업로드 실패, 예전 방식으로 재시도", e);
        return blobToBase64(b.blob).then(function (b64) {
          return uploadFile(b.name, mime, b64, true, null, parentId);
        }).catch(function (e2) {
          // 두 번 다 실패했으면 «처음» 실패한 이유가 진짜 원인이다. 그걸 앞에 세운다.
          var first = errText(e), second = errText(e2);
          throw new Error(first + (second && second !== first ? " · 재시도도 실패: " + second : ""));
        });
      });
  }

  function trashFile(id) {
    if (!id) return Promise.resolve();
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?supportsAllDrives=true", {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true })
    }).catch(function () {});
  }
  // 같은 폴더에 같은 이름이 있으면 -2, -3 … 을 붙인다
  function uniqueName(name, parentId) {
    var stem = stemOf(name), ext = extOf(name);
    var q = "'" + parentId + "' in parents and trashed=false and name contains '" + qEsc(stem) + "'";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(name)&pageSize=100&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) {
        var used = {};
        (j.files || []).forEach(function (f) { used[f.name] = 1; });
        if (!used[name]) return name;
        var i = 2;
        while (used[stem + "-" + i + ext]) i++;
        return stem + "-" + i + ext;
      })
      .catch(function () { return name; });
  }

  /* =========================================================
     5. 파일 이름 규칙
     ========================================================= */
  // 연결된 드라이브 폴더 이름 (파일명 앞머리에 붙이는 용도)
  function folderLabel() { return safeName(folder.name, 30); }
  function subfolderLabel() {
    if (settings.folderMode === "materials") return safeName(settings.materialsFolderName, 30);
    if (settings.folderMode === "monthly") return dateStamp().slice(0, 7);
    if (settings.folderMode === "tag") {
      // 작성 중인 기록의 첫 태그. 파일 이름 미리보기에서도 이게 {하위폴더} 로 보인다.
      var raw = ($("tags") && $("tags").value) || "";
      var first = raw.split(",")[0].trim();
      return first ? safeName(first, 30) : NO_TAG_FOLDER;
    }
    return "";
  }

  function applyPattern(pattern, ctx) {
    var out = String(pattern || "").replace(/\{([^}]*)\}/g, function (m, k) {
      switch (k) {
        case "폴더명": return ctx.folder;
        case "하위폴더": return ctx.subfolder;
        case "날짜": return ctx.date;
        case "시간": return ctx.time;
        case "유형": return ctx.type;
        case "제목": return ctx.title;
        case "태그": return ctx.tag;             // 첫 태그. 없으면 빈칸 (구분자는 알아서 정리된다)
        case "자료제목": return ctx.caption;      // 이 사진·파일에 적어 둔 제목
        case "번호": return ctx.no;
        case "원본이름": return ctx.stem;
        case "확장자": return ctx.ext.replace(/^\./, "");
        default: return "";
      }
    });
    out = safeName(out, 110);
    // 빈 토큰 때문에 생긴 중복 구분자를 정리한다 (예: 폴더 미연결 시 "_2026-08-16_…")
    out = out.replace(/_{2,}/g, "_").replace(/^[_\s-]+/, "").replace(/[_\s-]+$/, "");
    return out || "무제";
  }
  /* 태그는 여러 개일 수 있다. 파일 이름에는 «첫 태그» 만 넣는다.
     전부 넣으면 이름이 걷잡을 수 없이 길어지고, 태그 순서를 바꾸면 이름도 바뀐다. */
  function firstTag(entry) {
    var t = (entry && entry.tags || []).filter(Boolean)[0];
    return t ? safeName(String(t), 24) : "";
  }
  function nameContext(entry, order, original, ext, caption) {
    return {
      folder: folderLabel(), subfolder: subfolderLabel(),
      date: dateStamp(entry.createdAt), time: timeStamp(entry.createdAt),
      type: typeOf(entry.type).label,
      title: safeName(entry.title, 40) || "무제",
      tag: firstTag(entry),
      caption: safeName(String(caption || ""), 40),
      no: pad2(order || 1),
      stem: safeName(stemOf(original || ""), 40),
      ext: ext || ""
    };
  }
  /* 사진·파일 이름.
     block 을 함께 주면 그 자료에 적어 둔 제목({자료제목})까지 이름에 들어간다. */
  function attachName(entry, order, original, block) {
    var ext = extOf(original);
    var ctx = nameContext(entry, order, original, ext, block && block.caption);
    if (!ctx.stem) ctx.stem = "파일";
    var name = applyPattern(settings.filePattern, ctx);
    if (settings.filePattern.indexOf("{확장자}") < 0) name += ext;
    return name;
  }
  function mdName(entry) {
    var ctx = nameContext(entry, 1, "", ".md");
    ctx.title = safeName(entry.title, 50) || "무제";
    return applyPattern(settings.mdPattern, ctx) + ".md";
  }
  function patternPreview(pattern, isMd) {
    var ctx = {
      folder: folderLabel() || "기록폴더", subfolder: subfolderLabel() || "자료",
      date: dateStamp(), time: timeStamp(),
      type: typeOf(currentType).label,
      title: safeName($("title") && $("title").value, 40) || "수업 회고",
      tag: safeName((($("tags") && $("tags").value) || "").split(",")[0].trim(), 24) || "수업설계",
      caption: isMd ? "" : "칠판 정리",
      no: "01", stem: "IMG_4821", ext: isMd ? ".md" : ".png"
    };
    var out = applyPattern(pattern, ctx);
    if (isMd) return out + ".md";
    return out + (pattern.indexOf("{확장자}") < 0 ? ".png" : "");
  }

  /* =========================================================
     5-2. 위키링크 [[제목]] · 백링크
     ========================================================= */
  // [[제목]] 또는 [[제목|보일 글자]]
  function wikiRe() { return /\[\[([^\[\]|]+?)(?:\|([^\[\]]*?))?\]\]/g; }
  function normTitle(s) { return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " "); }
  function isTextBlock(b) { return b.kind === "text" || b.kind === "quote" || b.kind === "heading"; }

  var _linkCache = null;   // { byTitle, out, back } · 렌더 한 번당 한 번만 계산
  function invalidateLinks() { _linkCache = null; }

  function linkData() {
    if (_linkCache) return _linkCache;
    var byTitle = {}, out = {}, back = {};
    entries.forEach(function (n) {
      var k = normTitle(n.title);
      if (k && !byTitle[k]) byTitle[k] = n;
    });
    var byId = {};
    entries.forEach(function (n) { byId[n.id] = n; });
    entries.forEach(function (n) {
      var seen = {}, list = [];
      // ① 글 안에 쓴 [[제목]]
      (n.blocks || []).forEach(function (b) {
        if (!isTextBlock(b)) return;
        var re = wikiRe(), m;
        while ((m = re.exec(b.text || ""))) {
          var target = (m[1] || "").trim();
          var k = normTitle(target);
          if (!k || seen[k]) continue;
          seen[k] = 1;
          list.push({ title: target, key: k, to: byTitle[k] ? byTitle[k].id : null, via: "text", label: "" });
        }
      });
      // ② 관계망에서 직접 이어준 연결 (설명이 붙을 수 있음)
      (n.relations || []).forEach(function (r) {
        var tgt = byId[r.to];
        if (!tgt) return;
        var k = normTitle(tgt.title);
        var already = null;
        for (var i = 0; i < list.length; i++) if (list[i].key === k) { already = list[i]; break; }
        if (already) {
          already.via = "both";
          if (r.label && !already.label) already.label = r.label;
          return;
        }
        seen[k] = 1;
        list.push({ title: tgt.title, key: k, to: tgt.id, via: "relation", label: r.label || "" });
      });
      out[n.id] = list;
      list.forEach(function (l) {
        if (!l.to || l.to === n.id) return;
        (back[l.to] = back[l.to] || []).push({ from: n.id, label: l.label || "" });
      });
    });
    _linkCache = { byTitle: byTitle, out: out, back: back };
    return _linkCache;
  }
  /* 목록 보기에서 이 기록이 놓일 «폴더 이름».
     정리 방식이 정하는 그대로다. 드라이브에 실제로 만들어지는 폴더와 같은 이름이어야
     화면과 드라이브가 어긋나지 않는다. */
  var listOpen = {};          // 목록 보기에서 접은 폴더
  var linkOpen = {};          // 목록 보기에서 «연결» 을 펼쳐 둔 기록
  function listFolderOf(n) {
    var mode = settings.folderMode;
    if (mode === "perEntry") return entryFolderName(n);
    if (mode === "materials") return "";                       // 글은 맨 위에 놓인다
    if (mode === "monthly") return dateStamp(n.createdAt).slice(0, 7);
    if (mode === "tag") return primaryTagFolder(n);
    return "";                                                 // flat
  }

  /* 목록 한 줄. 연결(🔗)을 눌러 «누구와 이어져 있는지» 그 자리에서 펼쳐 본다.
     잇는 것은 여전히 편집·관계망에서 하고, 여기서는 «보기» 만 한다. */
  function listRow(n, indented) {
    var t = typeOf(n.type);
    var wrap = el("div", "lwrap");
    var row = el("div", "lrow" + (indented ? " lin" : ""));
    row.setAttribute("data-eid", n.id);
    row.appendChild(el("span", "lico", t.icon));
    var ttl = el("button", "ltitle", n.title || "(제목 없음)");
    ttl.addEventListener("click", function () {
      settings.viewMode = "stream"; saveSettingsLocal(); expanded[n.id] = true; render(); gotoEntry(n.id);
    });
    row.appendChild(ttl);

    var outs = outLinks(n).filter(function (l) { return l.to; });
    var ins = backLinks(n);
    if (outs.length || ins.length) {
      var lk = el("button", "lmeta linkbtn" + (linkOpen[n.id] ? " on" : ""), "🔗 " + outs.length + "/" + ins.length);
      lk.type = "button";
      lk.title = "이어진 기록 보기 (나가는 " + outs.length + " · 들어오는 " + ins.length + ")";
      lk.addEventListener("click", function () { linkOpen[n.id] = !linkOpen[n.id]; render(); });
      row.appendChild(lk);
    }
    var att = (n.blocks || []).filter(function (b) { return b.kind === "image" || b.kind === "file"; }).length;
    if (att) row.appendChild(el("span", "lmeta", "📎 " + att));
    row.appendChild(el("span", "lwhen", formatDate(n.createdAt).slice(0, 10)));
    var bd = el("button", "btn xs danger", "✕");
    bd.addEventListener("click", function () { removeEntry(n.id); });
    row.appendChild(bd);
    wrap.appendChild(row);

    if (linkOpen[n.id]) {
      var panel = el("div", "linkpanel" + (indented ? " lin" : ""));
      /* ⚠️ 두 목록의 «생김새가 다르다».
         outLinks 는 { to, label } 이고, backLinks 는 { entry, label } 이다.
         한 가지로 뭉뚱그리면 들어오는 연결이 통째로 안 보인다. */
      function side(label, items, isBack) {
        if (!items.length) return;
        var g = el("div", "linkgroup");
        g.appendChild(el("span", "linklabel", label));
        items.forEach(function (l) {
          var to = isBack ? l.entry : entries.filter(function (e) { return e.id === l.to; })[0];
          if (!to) return;
          var b = el("button", "linkchip", (typeOf(to.type).icon || "") + " " + (to.title || "(제목 없음)"));
          b.type = "button";
          if (l.label) b.appendChild(el("span", "linkwhy", " · " + l.label));
          b.addEventListener("click", function () {
            settings.viewMode = "stream"; saveSettingsLocal(); expanded[to.id] = true; render(); gotoEntry(to.id);
          });
          g.appendChild(b);
        });
        panel.appendChild(g);
      }
      side("이 기록이 가리키는 것", outs, false);
      side("이 기록을 가리키는 것", ins, true);
      panel.appendChild(el("span", "linkhint", "잇거나 끊는 것은 «편집» 또는 «관계망» 에서 합니다."));
      wrap.appendChild(panel);
    }
    return wrap;
  }

  function outLinks(n) { return linkData().out[n.id] || []; }
  function backLinks(n) {
    var list = linkData().back[n.id] || [];
    return list.map(function (b) {
      var e = entries.filter(function (x) { return x.id === b.from; })[0];
      return e ? { entry: e, label: b.label || "" } : null;
    }).filter(Boolean);
  }
  // 관계망에서 만든 연결 추가·삭제
  function addRelation(fromId, toId, label) {
    if (!fromId || !toId || fromId === toId) return false;
    var n = entries.filter(function (x) { return x.id === fromId; })[0];

  function bytesToB64url(bytes) {

  /* ⚠️ view.html 의 decodePacket() 과 «짝» 이다. 한쪽을 고치면 다른 쪽도 고쳐야 한다.

  // 한 편짜리 .md 는 자료와 같은 폴더에 있으므로 base 없이 파일 이름만 쓴다.

  }

  function buildMarkdown(n) {

    var links = (n.blocks || []).filter(function (b) { return b.kind === "link"; });

    L.push("created: " + isoDate(n.createdAt));

    '[data-theme="memo"],[data-theme="brick"],[data-theme="play"]{--bg:#FBF6EE;--panel:#FFFDF8;--ink:#26221E;',
    "--soft:#6E6459;--brand:#A8483C;--line:#26221E;--font-title:'Gaegu',var(--font-body);--bw:2.5px}",
    '[data-theme="brick"]{--radius:8px}',
    '[data-theme="play"]{--radius:18px;--bw:3.5px;--font-title:"Jua",var(--font-body)}',
    '[data-theme="note"]{--bg:#EFE7DA;--panel:#FFFCF5;--ink:#26221E;--soft:#6E6459;--brand:#A8483C;',
    "--line:#DCD1BE;--font-title:'Gaegu',var(--font-body);--radius:4px;--bw:1.5px}",
    '[data-theme="paper"]{--bg:#F4F2ED;--panel:#fff;--ink:#1F1D1A;--soft:#6B6660;--brand:#3A4A5C;',
    "--line:#DAD5CC;--font-body:'Gowun Batang',serif;--font-title:'Gowun Batang',serif;--radius:2px}",
    '[data-theme="draft"]{--bg:#EDF1F4;--panel:#fff;--ink:#16202B;--soft:#5A6B7C;--brand:#0E6FA8;',
    "--line:#C6D2DC;--font-body:'IBM Plex Sans KR',sans-serif;--font-title:'IBM Plex Sans KR',sans-serif;--radius:0px}",
    /* 레고 · 지금의 단 하나의 모양. 옛 블록들은 옛 링크·옛 파일을 위해 남겨 둔다 */
    '[data-theme="lego"]{--bg:#FBF6EE;--panel:#FFFDF8;--ink:#26221E;--soft:#6E6459;--brand:#A8483C;',
    "--line:#E2D8C6;--font-title:'Jua',var(--font-body);--radius:20px;--bw:1px}"
  ].join("");

  function htmlPage(titleEsc, inner, book) {
    var th = settings.theme || "base";
    var tm = themeOf(th);
    var css = [
      EXPORT_TOKENS,
      "*{box-sizing:border-box}",
      "body{margin:0;padding:36px 18px 72px;background:var(--bg);color:var(--ink);line-height:1.75;",

      "font-size:16px;word-break:keep-all}",
      "h1,h2,h3{font-family:var(--font-title)}",
      "main{max-width:760px;margin:0 auto;background:var(--panel);border:var(--bw) solid var(--line);",
      "border-radius:var(--radius);padding:40px 44px;box-shadow:0 6px 24px rgba(20,30,60,.06)}",
      "h1{font-size:27px;line-height:1.35;margin:0 0 10px}",
      "h2{font-size:19px;margin:32px 0 10px;padding-top:4px}",

      "hr{border:none;border-top:1px solid var(--line);margin:20px 0}",
      "blockquote{margin:0 0 16px;padding:10px 16px;border-left:3px solid var(--brand);",
      "background:var(--bg);border-radius:0 10px 10px 0;color:#333c52}",
      "a{color:var(--brand);text-decoration:none;border-bottom:1px solid rgba(63,91,217,.3)}",
      "a:hover{border-bottom-color:var(--brand)}",
      "ul{margin:0 0 14px;padding-left:22px}",
      "li{margin-bottom:5px}",
      "img,iframe,video{max-width:100%;border-radius:10px}",
      "@media(max-width:700px){body{padding:14px 10px 48px}main{padding:22px 18px;border-radius:12px}h1{font-size:22px}}",
      "@media print{body{background:#fff;padding:0}main{max-width:none;border:none;border-radius:0;box-shadow:none;padding:0}}"
    ].join("");
    var bookCss = !book ? "" : [
      "h1.booktitle{font-size:34px;margin:8px 0 6px;line-height:1.3}",
      "p.booksub{color:var(--soft);font-size:14px;margin:0 0 26px;padding-bottom:22px;border-bottom:2px solid var(--line)}",
      "nav.toc{background:var(--bg);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:18px 22px;margin:0 0 34px}",
      "nav.toc h2{margin:0 0 10px;font-size:17px}",
      "nav.toc ol{margin:0;padding-left:20px}",
      "nav.toc li{margin:6px 0}",
      "nav.toc a{font-weight:600}",
      "nav.toc .tocmeta{display:block;font-size:12px;color:var(--soft);border:0}",
      "section.chapter{margin:0 0 10px;padding:26px 0 6px;border-top:var(--bw) solid var(--line)}",
      "section.chapter:first-of-type{border-top:0}",
      "section.chapter h2{font-size:23px;margin:0 0 6px}",
      "p.chmeta{color:var(--soft);font-size:13px;margin:0 0 16px}",
      ".chlinks{margin:18px 0 0;padding:11px 14px;background:var(--bg);border-radius:var(--radius);font-size:13.5px;color:var(--ink)}",
      "@media print{section.chapter{break-before:page;page-break-before:always}",
      "section.chapter:first-of-type{break-before:auto;page-break-before:auto}",
      "nav.toc{break-after:page;page-break-after:always}}"
    ].join("");
    /* 고른 프리셋이 손글씨·명조 글꼴을 쓰면 그 글꼴도 함께 불러온다.
       기본(base)은 글꼴을 안 받는다. 안 쓰는 사람까지 기다리게 할 이유가 없다. */
    var fontLink = tm.font
      ? '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=' + tm.font + '&display=swap" />\n'
      : "";
    var themeAttr = (th && th !== "base") ? ' data-theme="' + th + '"' : "";
    return '<!doctype html>\n<html lang="ko"' + themeAttr + '>\n<head>\n<meta charset="utf-8" />\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1" />\n' + fontLink +
      "<title>" + titleEsc + "</title>\n<style>" + css + bookCss + "</style>\n</head>\n<body>\n<main>\n" +
      inner + "\n</main>\n</body>\n</html>";
  }
  // 구글 문서로 변환 저장 (mimeType 은 문서, 올리는 본문은 HTML)
  function saveAsGoogleDoc(n, parentId) {
    var name = stemOf(mdName(n));
    var html = buildHtml(n);
    return uploadFile(name, "application/vnd.google-apps.document", html, false, n.docId || null, parentId, "text/html")
      .then(function (r) { if (r && r.id) n.docId = r.id; })
      .catch(function (e) { console.warn("구글 문서 저장 실패", e); });
  }
  function saveAsHtml(n, parentId) {
    var name = stemOf(mdName(n)) + ".html";
    return uploadFile(name, "text/html", buildHtml(n), false, n.htmlId || null, parentId)
      .then(function (r) { if (r && r.id) n.htmlId = r.id; })
      .catch(function (e) { console.warn("HTML 저장 실패", e); });
  }

  /* =========================================================
     7. 동기화
     ========================================================= */
  function slimBlock(b) {
    var o = { id: b.id, kind: b.kind };
    if (b.kind === "text" || b.kind === "heading" || b.kind === "quote") o.text = b.text || "";
    if (b.kind === "link") { o.url = b.url || ""; o.label = b.label || ""; }
    if (b.kind === "embed") { o.code = b.code || ""; o.height = b.height || 360; }
    if (b.kind === "image" || b.kind === "file") {
      o.original = b.original || ""; o.mime = b.mime || ""; o.size = b.size || 0;
      o.name = b.name || ""; o.caption = b.caption || ""; o.fileId = b.fileId || null;
    }
    return o;
  }
  function slim(n) {
    return {
      id: n.id, type: n.type, title: n.title, tags: n.tags || [],
      blocks: (n.blocks || []).filter(function (b) { return b.kind !== "image" && b.kind !== "file" ? true : !!b.fileId; }).map(slimBlock),
      relations: (n.relations || []).map(function (r) { return { to: r.to, label: r.label || "" }; }),
      pinned: !!n.pinned,
      createdAt: n.createdAt, updatedAt: n.updatedAt,
      mdId: n.mdId || null, mdName: n.mdName || null,
      docId: n.docId || null, htmlId: n.htmlId || null,
      srcId: n.srcId || null,          // 폴더에서 끌어온 것이라면, 그 원본 파일 ID
      srcFolderId: n.srcFolderId || null, srcFolderName: n.srcFolderName || null,
      srcPath: (n.srcPath || []).slice(),
      folderId: n.folderId || null, folderName: n.folderName || null,
      /* 골라 둔 자리 · 지우기는 이 칸을 절대 안 본다 (folderId 와 다른 이유) */
      deskId: n.deskId || null, deskName: n.deskName || null,
      deskPath: (n.deskPath || []).slice(),
      shareUrl: n.shareUrl || null,
      sharePubUrl: n.sharePubUrl || null,
      shareWebUrl: n.shareWebUrl || null,
      shareWebAt: n.shareWebAt || null, shareWebTheme: n.shareWebTheme || null,
      shareWebTone: n.shareWebTone || null,
      shareFolderUrl: n.shareFolderUrl || null
    };
  }
  /* ---- 옛 이름(PKEMS-…)으로 남아 있는 파일 이어받기 ----
     새로 만들지 않는다. 이미 있는 파일의 «이름만» 바꾼다.
     파일 ID 가 그대로라 안에 든 것은 한 글자도 안 움직인다.
     이름 바꾸기가 실패해도 그 파일을 그대로 쓴다. 기록을 못 보는 일은 없어야 한다. */
  function renameFile(id, name) {
    return driveJson("https://www.googleapis.com/drive/v3/files/" + id + "?fields=id&supportsAllDrives=true", {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name })
    }).catch(function () { return null; });
  }
  // 옛 이름은 여러 개일 수 있다(PEER → PKEMS 순). 최근 것부터 찾는다.
  function findOrInherit(newName, oldNames) {
    return findInFolder(newName, folder.id).then(function (id) {
      if (id) return id;
      return (oldNames || []).reduce(function (chain, old) {
        return chain.then(function (found) {
          if (found) return found;
          return findInFolder(old, folder.id).then(function (oldId) {
            if (!oldId) return null;
            console.info("옛 이름 " + old + " 을 " + newName + " 으로 이어받습니다.");
            return renameFile(oldId, newName).then(function () { return oldId; });
          });
        });
      }, Promise.resolve(null));
    });
  }

  function findIndexFile() {
    if (indexFileId) return Promise.resolve(indexFileId);
    return findOrInherit(INDEX_NAME, OLD_INDEX_NAMES).then(function (id) { indexFileId = id; return id; });
  }
  /* ---- 조각 나누기에 쓰는 것들 ---- */
  function shardName(i) { return SHARD_PREFIX + ("0" + i.toString(16)).slice(-2) + ".json"; }
  // 짧고 빠른 지문(FNV-1a). 암호가 아니라 «바뀌었나» 만 본다
  function fnv(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h >>> 0;
  }
  /* 어느 조각에 넣을지는 «기록 아이디» 로만 정한다.
     그래야 글을 고쳐도 조각을 옮겨 다니지 않고, 그 조각 하나만 다시 올리면 된다. */
  function shardOf(id, n) { return fnv(String(id)) % n; }
  /* 조각 한 덩이의 글자. 들어온 차례가 달라도 «같은 글자» 가 나와야
     지문을 견줘 «안 바뀐 조각» 을 건너뛸 수 있다. 그래서 여기서 한 번 줄을 세운다. */
  function shardBody(i, n, arr) {
    arr = arr.slice().sort(function (a, b) {
      return (b.createdAt || 0) - (a.createdAt || 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
    return JSON.stringify({ version: 4, app: "TRACE", n: i, of: n, entries: arr });
  }
  // 지금 기록을 조각별 글자로 만든다. 한 조각이라도 너무 크면 조각 수를 두 배로 늘려 다시 짠다
  function buildShards() {
    var slims = entries.map(slim), n = shardCount, strs;
    for (;;) {
      var parts = [], i;
      for (i = 0; i < n; i++) parts.push([]);
      slims.forEach(function (e) { parts[shardOf(e.id, n)].push(e); });
      strs = parts.map(function (p, k) { return shardBody(k, n, p); });
      var tooBig = strs.some(function (s) { return s.length > SHARD_MAX; });
      if (!tooBig || n >= SHARD_CAP) break;
      n *= 2;
    }
    if (n !== shardCount) { shardCount = n; shardSig = {}; }   // 다시 나눴으면 전부 새로 올린다
    return strs;
  }
  // 조각 하나를 올린다. 파일 ID 를 모르면 이름으로 먼저 찾는다(색인이 지워졌다 되살아난 경우)
  function putShard(i, body) {
    var p = shardIds[i] ? Promise.resolve(shardIds[i]) : findInFolder(shardName(i), folder.id);
    return p.then(function (id) {
      return uploadFile(shardName(i), "application/json", body, false, id || null, folder.id);
    }).then(function (r) { if (r && r.id) shardIds[i] = r.id; });
  }

  function saveIndex() {
    /* ⚠️ 색인을 다 못 읽은 채로 저장하면, 못 읽은 조각의 기록이 통째로 사라진다.
       읽기가 반쪽이었으면 아무것도 쓰지 않는다. */
    if (indexIncomplete) {
      toast("색인을 다 읽지 못해 저장하지 않았습니다. 기록은 그대로 있습니다.");
      toast2("새로고침한 뒤 다시 연결해 주세요.");
      return Promise.resolve();
    }
    pruneTombs();

    // 작을 때는 나누지 않는다. 옛 버전으로 열어도 그대로 보이게
    if (!sharded) {
      var flat = JSON.stringify({ version: 3, app: "TRACE", entries: entries.map(slim), deleted: tombstones });
      if (flat.length <= SHARD_MAX) {
        return findIndexFile().then(function (id) {
          return uploadFile(INDEX_NAME, "application/json", flat, false, id, folder.id);
        }).then(function (r) { if (r && r.id) indexFileId = r.id; });
      }
      sharded = true;   // 여기서부터는 조각으로 간다
    }

    var strs = buildShards();
    /* 바뀐 조각만 올린다. 빈 조각은 파일부터 만들지 않는다. 
       기록이 몇 편일 때 빈 파일 수십 개가 폴더에 널리면 안 된다. */
    var jobs = [];
    strs.forEach(function (s, i) {
      var sig = fnv(s);
      if (shardIds[i] && shardSig[i] === sig) return;
      if (!shardIds[i] && s.indexOf('"entries":[]') >= 0) return;
      jobs.push({ i: i, body: s, sig: sig });
    });

    return jobs.reduce(function (chain, j) {
      // 조각을 «먼저» 다 올리고 목차를 나중에 올린다. 중간에 끊겨도 목차는 옛것이라 짝이 안 어긋난다
      return chain.then(function () { return putShard(j.i, j.body).then(function () { shardSig[j.i] = j.sig; }); });
    }, Promise.resolve()).then(function () {
      var man = {
        version: 4, app: "TRACE", shardCount: shardCount, count: entries.length,
        shards: strs.map(function (s, i) { return { n: i, id: shardIds[i] || null, bytes: s.length }; })
                    .filter(function (x) { return x.id; }),
        deleted: tombstones
      };
      return findIndexFile().then(function (id) {
        return uploadFile(INDEX_NAME, "application/json", JSON.stringify(man, null, 2), false, id, folder.id);
      }).then(function (r) { if (r && r.id) indexFileId = r.id; });
    });
  }

  function readMedia(id) {
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
      .then(function (r) { return r.json(); });
  }
  /* 목차(TRACE-index.json)를 보고 조각을 다 읽는다.
     하나라도 못 읽으면 «반쪽» 이라고 표시하고 저장을 막는다. */
  function loadSharded(man) {
    shardCount = man.shardCount || 1;
    shardIds = {}; shardSig = {};
    var out = [];
    return (man.shards || []).reduce(function (chain, s) {
      return chain.then(function () {
        var p = s.id ? Promise.resolve(s.id) : findInFolder(shardName(s.n), folder.id);
        return p.then(function (id) {
          if (!id) throw new Error(shardName(s.n) + " 을 찾지 못했습니다");
          return readMedia(id).then(function (j) {
            shardIds[s.n] = id;
            ((j && j.entries) || []).forEach(function (e) { out.push(e); });
          });
        });
      });
    }, Promise.resolve()).then(function () {
      // 다음 저장에서 «안 바뀐 조각» 을 건너뛸 수 있게, 읽어 온 그대로의 지문을 재어 둔다
      var parts = [], i;
      for (i = 0; i < shardCount; i++) parts.push([]);
      out.forEach(function (e) { parts[shardOf(e.id, shardCount)].push(e); });
      parts.forEach(function (p, k) { shardSig[k] = fnv(shardBody(k, shardCount, p)); });
      return { entries: migrate(out), deleted: man.deleted || [] };
    }).catch(function (e) {
      console.warn("색인 조각 읽기 실패", e);
      indexIncomplete = true;
      toast("색인 조각을 다 읽지 못했습니다. 덮어쓰지 않습니다.");
      toast2("새로고침한 뒤 다시 연결해 주세요.");
      return { entries: [], deleted: man.deleted || [] };
    });
  }
  /* 옛 버전으로 한 번 저장하면 목차가 «통째로 든 색인» 으로 덮여 쓰인다.
     그래도 조각 파일은 폴더에 그대로 남아 있으므로, 이름으로 찾아 함께 읽어 준다.
     이 한 겹이 없으면 «기기 하나가 옛 버전» 인 것만으로 십삼 년치가 안 보이게 된다. */
  function readStrayShards(base) {
    if (strayChecked) return Promise.resolve(base);   // 연결마다 한 번이면 된다
    strayChecked = true;
    var q = "name contains '" + qEsc(SHARD_PREFIX) + "' and '" + folder.id + "' in parents and trashed=false";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name)&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) {
        var files = (j.files || []).filter(function (f) { return /^TRACE-index-[0-9a-f]{2}\.json$/.test(f.name); });
        if (!files.length) return base;
        console.info("옛 형식 색인 옆에 조각 " + files.length + "개가 남아 있어 함께 읽습니다.");
        var map = {};
        base.entries.forEach(function (e) { map[e.id] = e; });
        return files.reduce(function (chain, f) {
          return chain.then(function () {
            return readMedia(f.id).then(function (js) {
              ((js && js.entries) || []).forEach(function (e) {
                var cur = map[e.id];
                if (!cur || (e.updatedAt || 0) > (cur.updatedAt || 0)) map[e.id] = e;
              });
            });
          });
        }, Promise.resolve()).then(function () {
          base.entries = migrate(Object.keys(map).map(function (k) { return map[k]; }));
          return base;
        });
      })
      .catch(function () { return base; });
  }
  // 원격 색인을 { entries, deleted } 로 읽는다 (구버전은 deleted 가 없음)
  function loadIndex() {
    indexIncomplete = false;
    return findIndexFile().then(function (id) {
      if (!id) { sharded = false; shardCount = 1; shardIds = {}; shardSig = {}; return { entries: [], deleted: [] }; }
      return readMedia(id)
        .then(function (j) {
          if (j && j.shards) { sharded = true; return loadSharded(j); }
          // 옛 형식 · 색인 하나에 다 들어 있다
          sharded = false; shardCount = 1; shardIds = {}; shardSig = {};
          return readStrayShards({ entries: migrate((j && j.entries) || []), deleted: (j && j.deleted) || [] });
        })
        .catch(function (e) {
          /* 예전에는 여기서 조용히 «빈 색인» 을 돌려주었다.
             그러면 곧바로 이어지는 저장이 드라이브의 색인을 «이 기기에 있는 것만» 으로 덮어썼다.
             신호가 잠깐 끊긴 것만으로 십삼 년치가 날아갈 수 있는 자리였다. */
          console.warn("색인 읽기 실패", e);
          indexIncomplete = true;
          toast("색인을 읽지 못했습니다. 기록을 덮어쓰지 않습니다.");
          return { entries: [], deleted: [] };
        });
    });
  }
  function addTomb(id) {

  }

    var map = {};

      if (!t || !t.id) return;
      if (!map[t.id] || (t.at || 0) > map[t.id].at) map[t.id] = { id: t.id, at: t.at || 0 };
    });

  }

  }
  function saveSettingsRemote() {
    if (!connected || !folder.id) return Promise.resolve();

    var p = settingsFileId ? Promise.resolve(settingsFileId) : findOrInherit(SETTINGS_NAME, OLD_SETTINGS_NAMES);
    return p.then(function (id) {
      settingsFileId = id;
      return uploadFile(SETTINGS_NAME, "application/json", content, false, id, folder.id);
    }).then(function (r) { if (r && r.id) settingsFileId = r.id; }).catch(function () {});
  }
  function loadSettingsRemote() {
    return findOrInherit(SETTINGS_NAME, OLD_SETTINGS_NAMES).then(function (id) {
      if (!id) return null;

    });

  function syncPending() {
    if (!connected || !folder.id) return Promise.resolve();

    // 손볼 게 있는 기록만 추린다
    var todo = entries.filter(function (n) {
      if (n._dirty || !n.mdId) return true;
      return (n.blocks || []).some(function (b) {
        if (b.kind !== "image" && b.kind !== "file") return false;
        if (!b.fileId && b.blob) return true;
        return !!(b._remask && b.blob);          // 가려서 새로 덮어써야 하는 사진
      });
    });
    if (!todo.length) return Promise.resolve();

    var total = todo.length + 1, done = 0;
    function tick() { done++; progress(Math.round(done / total * 100)); }

    return todo.reduce(function (chain, n) {
      return chain.then(function () {
        var t;
        return resolveTargets(n)
          .then(function (target) {
            t = target;
            /* 이미 드라이브에 있는 파일을 옮기는 것은 «사람이 시켰을 때» 만 한다.
               설정 → 「기존 파일도 새 방식으로 옮기기」 가 그 자리다 (n._relocate).
               ⚠️ 예전에는 «폴더가 새로 생겼으면» (t.created) 도 같이 옮겼다. 그런데 가져온 기록은
                  제 폴더가 없어서, 한 번 고치는 것만으로 폴더가 새로 생기고 십삼 년 동안 있던
                  자리에서 원본이 딸려 나왔다. 자리는 드라이브가 정한다. 앱은 새로 만드는 것만 정한다. */
            if (!n._relocate) return;
            var oldFolder = (settings.folderMode !== "perEntry") ? n.folderId : null;
            delete n._relocate;
            return relocateEntryFiles(n, t).then(function () {
              if (oldFolder) { trashFile(oldFolder); n.folderId = null; n.folderName = null; }
            });
          })
          .then(function () {
            // 대기 중인 첨부 업로드
            var pending = (n.blocks || []).filter(function (b) {
              return (b.kind === "image" || b.kind === "file") && !b.fileId && b.blob;
            });
            return pending.reduce(function (p, b) {
              return p.then(function () {
                // 진행률은 «큰 파일만» 이 아니라 항상 보여 준다.
                // 폰에서는 1MB 짜리도 몇십 초가 걸리는데, 아무 표시가 없으면 멈춘 줄 안다.
                var label = b.name.length > 14 ? b.name.slice(0, 14) + "…" : b.name;
                setSyncPill("↑ " + label + " 0%", true);
                return uploadAttachment(b, t.file, function (f) {
                  if (f < 0) { setSyncPill("↑ " + label + " 연결을 기다리는 중…", true); return; }
                  setSyncPill("↑ " + label + " " + Math.round(f * 100) + "%", true);
                })
                  .then(function (r) {
                    b.fileId = r.id; delete b.blob; dropPreview(b.id);
                    n._dirty = true; idbDel(b.id);
                  })
                  .catch(function (e) {
                    console.warn("첨부 업로드 실패", b.name, e);
                    toast("「" + b.name + "」 업로드 실패: " + errText(e));
                    toast2("이 기록은 «⏳ 업로드 대기» 로 남습니다. [동기화] 를 다시 누르면 재시도합니다.");
                  });
              });
            }, Promise.resolve());
          })
          .then(function () {
            /* 가려서 다시 올려야 하는 사진 · 같은 파일에 덮어쓴다.
               파일 아이디가 그대로라 색인도 글 속 링크도 어긋나지 않는다. */
            var remask = (n.blocks || []).filter(function (b) { return b._remask && b.blob && b.fileId; });
            return remask.reduce(function (p, b) {
              return p.then(function () {
                var label = b.name && b.name.length > 14 ? b.name.slice(0, 14) + "…" : (b.name || "사진");
                setSyncPill("🔲 " + label + " 다시 올리는 중 0%", true);
                return uploadBlob(b.name, b.mime || "image/jpeg", b.blob, t.file, b.fileId, function (f) {
                  if (f < 0) { setSyncPill("🔲 " + label + " 연결을 기다리는 중…", true); return; }
                  setSyncPill("🔲 " + label + " " + Math.round(f * 100) + "%", true);
                })
                  .then(function () {

                    idbDel(b.id); n._dirty = true;
                  })
                  .catch(function (e) {

                    toast("「" + (b.name || "사진") + "」 을 다시 올리지 못했습니다: " + errText(e));
                    toast2("드라이브에는 아직 «가리기 전» 사진이 있습니다. [동기화] 를 다시 눌러 주세요.");
                  });

          })
          .then(function () {
            if (!n._dirty && n.mdId) return;
            var want = mdName(n);
            var pre = n.mdId ? Promise.resolve(want) : uniqueName(want, t.md);
            return pre.then(function (finalName) {
              /* 이름도 자리와 같은 규칙이다 · 앱이 만든 파일은 앱이 이름을 정하고,
                 밖에서 온 파일(srcId)은 사람이 정한다. 밖에서 온 것의 이름을 바꾸는 길은
                 「📛 밖에서 넣은 파일 이름 정리」 하나뿐이다. 거기서는 사람이 보고 시킨다.
                 앱이 만든 파일이라도, 규칙이 내놓는 이름이 «지난번에 앱이 붙인 이름» 과 같으면
                 손대지 않는다. 사람이 드라이브에서 고쳐 둔 이름을 저장 한 번에 되돌리지 않으려는 것이다. */

  function connect(folderInputValue) {
    if (!clientId) { toast("앱에 구글 클라이언트 ID가 설정되지 않았습니다. 설정 → 고급에서 입력해 주세요."); return Promise.resolve(); }

      .catch(function (e) {

  /* =========================================================
     8. 블록 에디터
     ========================================================= */
  var BLOCK_META = {
    text:    { icon: "📝", label: "글" },
    heading: { icon: "🔠", label: "소제목" },
    quote:   { icon: "❝", label: "인용" },
    image:   { icon: "🖼️", label: "사진" },
    file:    { icon: "📎", label: "파일·영상" },
    link:    { icon: "🔗", label: "링크" },
    embed:   { icon: "🧩", label: "코드 삽입" },
    divider: { icon: "➖", label: "구분선" }
  };
  // 유튜브 등 주소만 넣어도 알아서 삽입 코드로 바꿔 준다
  function urlToEmbed(u) {
    u = String(u || "").trim();
    var m = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/.exec(u);
    if (m) return '<iframe width="560" height="315" src="https://www.youtube.com/embed/' + m[1] +
      '" title="YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    m = /vimeo\.com\/(\d+)/.exec(u);
    if (m) return '<iframe src="https://player.vimeo.com/video/' + m[1] + '" width="640" height="360" frameborder="0" allowfullscreen></iframe>';
    m = /docs\.google\.com\/[^\s"']+/.exec(u);
    if (m) return '<iframe src="' + m[0].replace(/\/(edit|view)[^\s"']*$/, "/preview") + '" width="100%" height="480" frameborder="0"></iframe>';
    m = /drive\.google\.com\/file\/d\/([\w-]+)/.exec(u);
    if (m) return '<iframe src="https://drive.google.com/file/d/' + m[1] + '/preview" width="100%" height="420" frameborder="0" allowfullscreen></iframe>';
    return null;
  }

  // 블록 복사 · JSON 복제를 쓰면 Blob(파일 본문)이 빈 객체로 뭉개진다
  function cloneBlock(b) {
    var c = {};
    for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) c[k] = b[k];
    return c;
  }

  function newBlock(kind, data) {
    var b = { id: uid(), kind: kind };
    if (kind === "text" || kind === "heading" || kind === "quote") b.text = "";
    if (kind === "link") { b.url = ""; b.label = ""; }
    if (kind === "embed") { b.code = ""; b.height = 360; }
    if (kind === "image" || kind === "file") { b.caption = ""; }
    if (data) for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k)) b[k] = data[k];
    return b;
  }
  function addBlock(kind, data, focus) {
    if (kind === "image") { $("imgInput").click(); return; }
    if (kind === "file") { $("fileInput").click(); return; }
    if (kind === "capture") { startCapture(); return; }
    if (kind === "draw") { openDrawModal(); return; }
    if (kind === "voice") { openVoiceModal(); return; }
    var b = newBlock(kind, data);
    blocks.push(b);
    renderBlocks();
    if (focus !== false) {
      var node = document.querySelector('[data-bid="' + b.id + '"]');
      var f = node && node.querySelector("textarea, input");
      if (f) f.focus();
    }
    return b;
  }
  function moveBlock(id, dir) {
    var i = blocks.findIndex(function (b) { return b.id === id; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= blocks.length) return;
    var t = blocks[i]; blocks[i] = blocks[j]; blocks[j] = t;
    renderBlocks();
  }
  // 끌어서 옮기기 · 지금 끌고 있는 블록
  var dragBlockId = null;
  function clearDropMarks() {
    Array.prototype.forEach.call(document.querySelectorAll(".block.dropbefore, .block.dropafter"), function (e) {
      e.classList.remove("dropbefore", "dropafter");
    });
  }
  function dropBlockOn(movingId, targetId, after) {
    var from = blocks.findIndex(function (b) { return b.id === movingId; });
    if (from < 0) return;
    var moved = blocks.splice(from, 1)[0];
    var to = blocks.findIndex(function (b) { return b.id === targetId; });
    if (to < 0) { blocks.splice(from, 0, moved); return; }
    blocks.splice(after ? to + 1 : to, 0, moved);
    dragBlockId = null;
    clearDropMarks();
    renderBlocks();
    touchDraft();
  }
  function removeBlock(id) {
    blocks = blocks.filter(function (b) { return b.id !== id; });
    renderBlocks();
  }
  function mediaOrder(b) {
    var n = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].kind === "image" || blocks[i].kind === "file") {
        n++;
        if (blocks[i].id === b.id) return n;
      }
    }
    return n;
  }
  function previewAttachName(b) {
    if (b.name) return b.name;
    return attachName({
      createdAt: Date.now(), title: $("title").value, type: currentType,
      tags: ($("tags").value || "").split(",").map(function (t) { return t.trim(); }).filter(Boolean)
    }, mediaOrder(b), b.original || "file", b);
  }

  function renderBlocks() {
    touchDraft();
    syncMaskBar();
    var host = $("blocks");
    host.innerHTML = "";
    if (!blocks.length) {
      var hint = el("div", "desc", "아래 버튼으로 글·사진·링크를 원하는 순서대로 추가하세요.");
      hint.style.padding = "6px 2px 10px";
      host.appendChild(hint);
    }
    blocks.forEach(function (b, idx) {
      var meta = BLOCK_META[b.kind] || BLOCK_META.text;
      var wrap = el("div", "block " + b.kind);
      wrap.setAttribute("data-bid", b.id);

      var head = el("div", "bhead");
      var grip = el("span", "bgrip", "⠿");
      grip.title = "끌어서 순서 옮기기";
      head.appendChild(grip);
      head.appendChild(el("span", "bkind", meta.icon + " " + meta.label));
      head.appendChild(el("span", "spacer"));
      var up = el("button", "btn xs bmove", "▲"); up.type = "button"; up.disabled = idx === 0;
      up.title = "위로";
      up.addEventListener("click", function () { moveBlock(b.id, -1); });
      var dn = el("button", "btn xs bmove", "▼"); dn.type = "button"; dn.disabled = idx === blocks.length - 1;
      dn.title = "아래로";
      dn.addEventListener("click", function () { moveBlock(b.id, 1); });
      var rm = el("button", "btn xs danger", "✕"); rm.type = "button";
      rm.title = "이 블록 지우기";
      rm.addEventListener("click", function () { removeBlock(b.id); });
      head.appendChild(up); head.appendChild(dn); head.appendChild(rm);
      wrap.appendChild(head);

      // 손잡이(⠿)를 잡았을 때만 끌 수 있게 · 글 칸의 글자 선택을 방해하지 않는다
      grip.addEventListener("mousedown", function () { wrap.draggable = true; });
      grip.addEventListener("touchstart", function () { wrap.draggable = true; }, { passive: true });
      wrap.addEventListener("dragstart", function (e) {
        dragBlockId = b.id;
        wrap.classList.add("dragging");
        try { e.dataTransfer.setData("text/plain", b.id); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
      });
      wrap.addEventListener("dragend", function () {

      });

      });
      wrap.addEventListener("dragleave", function () { wrap.classList.remove("dropbefore", "dropafter"); });
      wrap.addEventListener("drop", function (e) {
        if (!dragBlockId || dragBlockId === b.id) return;
        e.preventDefault();
        var r = wrap.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        dropBlockOn(dragBlockId, b.id, after);
      });

      var body = el("div", "bbody");

      if (b.kind === "text" || b.kind === "quote") {
        var ta = el("textarea", "inp");
        ta.value = b.text || "";
        ta.placeholder = b.kind === "quote" ? "인용할 문장" : "내용을 적으세요.  [[ 를 치면 다른 기록과 연결됩니다";
        ta.rows = 3;
        ta.addEventListener("input", function () { b.text = ta.value; autoGrow(ta); });
        ta.addEventListener("paste", function (e) { handlePaste(e, b); });
        attachWiki(ta);
        body.appendChild(ta);
        setTimeout(function () { autoGrow(ta); }, 0);

      } else if (b.kind === "heading") {
        var hi = el("input", "inp");

              이제 올라간 사진에도 붙인다. 드라이브에서 받아 와 고치고 같은 파일에 덮어쓴다. */

      wrap.appendChild(body);

  /* ---------- 사진 넣는 방법 고르기 (PC / 모바일 공통 입구) ---------- */
  function isTouchDevice() {
    return (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
  }
  function captureSupported() {
    // 모바일 브라우저는 API 가 있어도 실제로는 막혀 있는 경우가 많다
    return !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) && !isTouchDevice();
  }
  var skipCrop = false;

  function openCaptureSheet() {
    closeModal();

    var body = el("div", "mbody");
    body.appendChild(el("p", "sheetnote", mobile
      ? "휴대폰 브라우저는 화면을 직접 캡처할 수 없습니다. 전원 + 음량↓(아이폰은 전원 + 음량↑)로 스크린샷을 찍은 뒤 갤러리에서 고르면 PC와 똑같이 영역을 잘라 넣을 수 있습니다."
      : "가장 빠른 방법은 Win+Shift+S(맥 ⌘⇧4)로 캡처한 뒤 아래 «클립보드에서 붙여넣기» 입니다. 창 공유 화면이 뜨지 않습니다."));

      sheetBtn("📷", "카메라로 찍기", "칠판·유인물을 바로 찍어 넣습니다", pickFromCamera);
      sheetBtn("📋", "클립보드에서 붙여넣기", "복사해 둔 이미지를 바로 넣습니다", pasteFromClipboard);
    } else {
      sheetBtn("📋", "클립보드에서 붙여넣기", "Win+Shift+S 로 캡처한 것을 바로 · 창 공유 안 뜸", pasteFromClipboard);
      sheetBtn("🖼️", "이미지 파일에서 고르기", "가지고 있는 사진의 일부만 잘라 넣습니다", function () { $("cropPickInput").click(); });
      sheetBtn("📷", "웹캠으로 찍기", "카메라 화면을 보면서 촬영합니다", openWebcam);
      sheetBtn("🖥️", "화면 캡처하기", "창·탭을 고르는 화면이 뜹니다", startScreenCapture);
    }

    var tg = el("label", "sheettoggle");
    var cb = el("input"); cb.type = "checkbox"; cb.checked = skipCrop;
    cb.addEventListener("change", function () { skipCrop = cb.checked; });

    tg.appendChild(document.createTextNode("자르지 않고 원본 그대로 넣기"));

  // 고른 이미지 파일 → (자르기 화면) → 사진 블록
  var MAX_EDGE = 2400; // 휴대폰 고화질 사진을 자르기 전에 적당히 줄인다
  function imageFileToCanvas(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, MAX_EDGE / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * s));
        c.height = Math.max(1, Math.round(h * s));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("이미지를 열 수 없습니다.")); };
      img.src = url;
    });
  }
  /* ---------- 웹캠으로 바로 찍기 (PC) ---------- */
  function openWebcam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("이 브라우저에서는 웹캠을 쓸 수 없습니다.");
      return;
    }
    var stream = null, alive = true;
    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(function (s) {
        stream = s;
        if (!alive) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
        showCam(s);
      })
      .catch(function (e) {
        var n = (e && e.name) || "";
        if (n === "NotAllowedError") toast("카메라 사용이 거부되었습니다. 주소창의 카메라 아이콘에서 허용해 주세요.");
        else if (n === "NotFoundError") toast("연결된 카메라를 찾지 못했습니다.");
        else toast("카메라를 열 수 없습니다: " + (e && e.message ? e.message : e));
      });

    function stop() {
      alive = false;
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }

    function showCam(s) {
      closeModal();
      var bg = el("div", "modal-bg");
      var m = el("div", "card modal"); m.style.maxWidth = "720px";
      var head = el("div", "mhead");
      head.appendChild(el("h3", null, "📷 웹캠으로 찍기"));
      head.appendChild(el("span", "spacer"));
      var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
      head.appendChild(x);
      m.appendChild(head);

      var body = el("div", "mbody"); body.style.textAlign = "center";
      var v = document.createElement("video");
      v.autoplay = true; v.playsInline = true; v.muted = true;
      v.className = "camview";
      v.srcObject = s;
      body.appendChild(v);
      body.appendChild(el("p", "crophint", "화면에 담기면 «찍기» 를 누르세요."));
      m.appendChild(body);

      var foot = el("div", "mfoot");
      foot.appendChild(el("span", "spacer"));
      var cancel = el("button", "btn", "취소");
      cancel.addEventListener("click", closeModal);
      var shoot = el("button", "btn primary", "📷 찍기");
      shoot.addEventListener("click", function () {
        var w = v.videoWidth, h = v.videoHeight;
        if (!w || !h) { toast("아직 화면이 준비되지 않았습니다. 잠시 후 다시 눌러 주세요."); return; }
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        stop();
        openCropModal(c, "웹캠_" + dateStamp() + "_" + timeStamp() + ".png");
      });
      foot.appendChild(cancel); foot.appendChild(shoot);
      m.appendChild(foot);

      bg.appendChild(m);
      bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
      $("modalHost").appendChild(bg);
      modalEl = bg;
      modalCleanup = stop;
    }
  }

  /* ---------- 클립보드에서 바로 붙여넣기 (창 공유 없이) ---------- */
  function pasteFromClipboard() {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      toast("이 브라우저는 버튼으로 붙여넣기를 지원하지 않습니다. 글 칸을 누르고 Ctrl+V 를 눌러 주세요.");
      return;
    }
    navigator.clipboard.read().then(function (items) {
      var files = [], jobs = [];
      items.forEach(function (it) {
        var type = it.types.filter(function (t) { return /^image\//.test(t); })[0];
        if (!type) return;
        jobs.push(it.getType(type).then(function (blob) {
          var ext = "." + (type.split("/")[1] || "png").replace("jpeg", "jpg");
          files.push(new File([blob], "붙여넣기_" + dateStamp() + "_" + timeStamp() + ext, { type: type }));
        }));
      });
      return Promise.all(jobs).then(function () {
        if (!files.length) { toast("클립보드에 이미지가 없습니다. 먼저 Win+Shift+S(맥 ⌘⇧4)로 캡처하세요."); return; }
        acceptFiles(files);
      });
    }).catch(function (e) {
      if (e && e.name === "NotAllowedError") toast("클립보드 읽기 권한이 필요합니다. 주소창 아이콘에서 허용하거나, 글 칸에서 Ctrl+V 를 쓰세요.");
      else toast("클립보드를 읽지 못했습니다. 글 칸에서 Ctrl+V 를 써 주세요.");
    });
  }

  // 카메라 촬영 · 누를 때만 입력칸을 만들고 바로 없앤다
  function pickFromCamera() {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.setAttribute("capture", "environment");
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0];
      setTimeout(function () { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 0);
      handlePickedImage(f);
    });
    inp.click();
  }

  function handlePickedImage(file) {
    if (!file) return;
    if (skipCrop) { acceptFiles([file]); return; }
    imageFileToCanvas(file)
      .then(function (c) { openCropModal(c, file.name); })
      .catch(function (e) { toast(e.message); });
  }

  /* ---------- 화면 캡처 (데스크톱) ---------- */
  function startCapture() { openCaptureSheet(); }

  function startScreenCapture() {
    if (!captureSupported()) {
      toast("이 브라우저·환경은 화면 캡처를 지원하지 않습니다. Win+Shift+S(맥은 ⌘⇧4)로 캡처한 뒤 글 칸에 Ctrl+V 로 붙여넣으세요.");
      return;
    }
    var askedAt = Date.now();
    navigator.mediaDevices.getDisplayMedia({ video: true, audio: false })
      .then(function (stream) {
        var v = document.createElement("video");
        v.srcObject = stream; v.muted = true; v.playsInline = true;
        return v.play().then(function () {
          // 첫 프레임이 실제로 그려질 때까지 잠깐 기다린다
          return new Promise(function (res) { setTimeout(function () { res(v); }, 300); });
        });
      })
      .then(function (v) {
        var w = v.videoWidth, h = v.videoHeight;
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        try { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
        if (!w || !h) { toast("캡처된 화면이 없습니다. 다시 시도해 주세요."); return; }
        openCropModal(c);
      })
      .catch(function (e) {
        var name = (e && e.name) || "";
        // 선택창이 뜰 새도 없이 거절됐다면 사용자가 취소한 게 아니라 브라우저가 막은 것이다
        var blocked = (Date.now() - askedAt) < 600;
        if ((name === "NotAllowedError" || name === "AbortError") && !blocked) return; // 사용자가 취소
        if (name === "NotAllowedError" || name === "NotSupportedError" || name === "AbortError") {
          toast("이 창에서는 화면 캡처가 막혀 있습니다. 크롬 등 일반 브라우저에서 열면 됩니다. (또는 Win+Shift+S 로 캡처 후 글 칸에 Ctrl+V)");
          return;
        }
        toast("화면 캡처 실패: " + (e && e.message ? e.message : e));
      });
  }

  // 캔버스를 PNG(너무 크면 JPEG) Blob 으로
  function canvasToAttachment(canvas, srcName) {
    var base = srcName
      ? safeName(stemOf(srcName), 40) + "_잘라냄"
      : "화면캡처_" + dateStamp() + "_" + timeStamp();
    return new Promise(function (res) {
      canvas.toBlob(function (png) {
        function done(blob, ext) {
          res({ original: base + ext, mime: blob.type, size: blob.size, blob: blob });
        }
        if (png && png.size > 6 * 1024 * 1024) {
          canvas.toBlob(function (jpg) { done(jpg || png, jpg ? ".jpg" : ".png"); }, "image/jpeg", 0.88);
        } else if (png) {
          done(png, ".png");
        } else {
          canvas.toBlob(function (jpg) { done(jpg, ".jpg"); }, "image/jpeg", 0.9);
        }
      }, "image/png");
    });
  }

  /* ---------- 🎙️ 녹음 · 받아쓰기 ----------
     소리는 MediaRecorder 로 담고, 받아쓰기는 브라우저에 딸린 음성인식을 쓴다.
     둘 다 «따로 키를 받을 것도, 돈 낼 것도» 없다.

     ⚠️ 솔직하게 적어 둔다. 이 화면을 열어 둔 동안에만 녹음된다.
        다른 앱으로 넘어가거나 화면이 꺼지면 브라우저가 마이크를 놓는다.
        «켜 두면 알아서» 는 웹앱으로는 안 되는 일이다. 그래서 화면이 꺼지지
        않게 붙잡아 두고, 끊기면 숨기지 않고 화면에 알린다. */
  function pickAudioType() {
    var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac", "audio/ogg"];
    for (var i = 0; i < candidates.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) {
        return candidates[i];
      }
    }
    return "";
  }
  function speechCtor() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }
  function mmss(sec) {
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function openVoiceModal() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      toast("이 브라우저는 녹음을 지원하지 않습니다.");
      return;
    }
    closeModal();

    var stream = null, rec = null, chunks = [], started = 0, timer = null;
    var recog = null, wantRecog = !!speechCtor(), recogOn = false;
    var finalText = "", interim = "";
    var audioBlob = null, audioType = pickAudioType();
    var pickedName = "";    // 밖에서 불러온 파일이면 그 이름을 그대로 쓴다
    var state = "idle";     // idle · recording · playing(파일을 틀어 놓고 받아 적는 중) · done

    var bg = el("div", "modal-bg");
    var m = el("div", "card modal"); m.style.maxWidth = "640px";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "🎙️ 녹음 · 받아쓰기"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕");
    x.addEventListener("click", function () { stopAll(); closeModal(); });
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody"); body.style.textAlign = "center";

    var clock = el("div", "voiceclock", "0:00");
    body.appendChild(clock);
    var meterWrap = el("div", "voicemeter");
    var meterBar = el("div", "voicebar");
    meterWrap.appendChild(meterBar);
    body.appendChild(meterWrap);

    /* ⚠️ 여기에 설명을 적지 말 것. 무엇을 하는 창인지는 아래 단추가 말해 준다.
       이 줄은 «지금 무슨 일이 일어나는가» 만 띄운다 (녹음 중·못 들었다·안 되는 것). */
    var warn = el("p", "crophint");
    warn.style.color = "var(--brand)";
    warn.textContent = wantRecog ? "" : "이 브라우저는 받아쓰기가 안 됩니다. 소리만 담깁니다.";
    body.appendChild(warn);

    /* 제목과 내용을 갈라 놓는다.
       제목은 «파일 이름» 이 되고, 받아 적은 글은 «본문» 이 된다. 둘을 섞으면 파일명이 문장이 된다. */
    var titleField = el("div", "field");
    titleField.style.textAlign = "left";   // 시계 때문에 창이 가운데 정렬이라, 적는 칸은 되돌려 놓는다
    titleField.appendChild(el("label", null, "제목"));
    var tin = el("input", "inp");
    tin.placeholder = "예: 8월 협의회";
    titleField.appendChild(tin);
    body.appendChild(titleField);

    var scriptField = el("div", "field");
    scriptField.style.textAlign = "left";
    scriptField.appendChild(el("label", null, "받아 적은 글"));
    var ta = el("textarea", "inp");
    ta.rows = 7;
    ta.placeholder = wantRecog ? "말하면 여기에 쌓입니다." : "여기에 직접 적어도 됩니다.";
    ta.addEventListener("input", function () { finalText = ta.value; interim = ""; });
    scriptField.appendChild(ta);
    body.appendChild(scriptField);

    var player = el("audio");
    player.controls = true;
    player.style.width = "100%";
    player.style.display = "none";
    fixAudioDuration(player);
    body.appendChild(player);
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var status = el("span", "desc"); status.style.margin = "0";
    foot.appendChild(status);
    foot.appendChild(el("span", "spacer"));
    var again = el("button", "btn", "다시 녹음");
    again.style.display = "none";
    again.addEventListener("click", function () {
      audioBlob = null; pickedName = ""; player.style.display = "none";
      finalText = ""; interim = ""; ta.value = "";
      state = "idle"; sync(); start();
    });
    var mainBtn = el("button", "btn primary", "● 녹음 시작");
    mainBtn.addEventListener("click", function () {
      if (state === "idle") start();
      else if (state === "recording") stopAll();
    });
    var put = el("button", "btn primary", "이 녹음 넣기");
    put.style.display = "none";
    put.addEventListener("click", commit);

    /* ---- 밖에서 녹음해 온 파일 불러오기 ----
       폰 녹음기·회의 녹음기로 담아 온 것이 대부분이다. 그것도 여기서 받아 적을 수 있어야
       «녹음 = 이 창» 이 된다. 안 그러면 파일은 파일대로 따로 붙이게 된다. */
    var pick = el("input"); pick.type = "file"; pick.accept = "audio/*"; pick.className = "hidden";
    var pickBtn = el("button", "btn", "📂 녹음 파일 불러오기");
    pickBtn.addEventListener("click", function () { pick.click(); });
    pick.addEventListener("change", function () {
      var f = pick.files && pick.files[0];
      pick.value = "";
      if (!f) return;
      if (f.size > MAX_FILE_MB * 1024 * 1024) {
        toast("「" + f.name + "」 는 " + MAX_FILE_MB + "MB 를 넘습니다.");
        return;
      }
      stopAll();
      audioBlob = f;
      pickedName = f.name;
      finalText = ""; interim = ""; ta.value = "";
      player.src = URL.createObjectURL(f);
      player.style.display = "";
      status.textContent = "불러옴: " + f.name + " · " + humanSize(f.size);
      state = "done"; sync();
      toast2(wantRecog ? "«🔊 틀어 놓고 받아 적기» 를 누르면 글로 옮겨 적어요."
                       : "받아쓰기는 크롬에서 됩니다.");
    });

    /* ---- 파일을 틀어 놓고 받아 적기 ----
       ⚠️ 브라우저 음성인식은 «마이크» 만 듣는다. 파일을 직접 먹일 길이 없다.
          그래서 스피커로 틀고 마이크가 그것을 듣게 한다. 그래서 두 가지가 중요하다. 
          ① 이어폰을 끼면 마이크가 못 듣는다 ② 반향 제거를 꺼야 한다.
          반향 제거(echoCancellation)는 «스피커에서 나온 소리를 지우는» 기능이라,
          켜 두면 정확히 우리가 들려주려는 소리만 지워 버린다. */
    var play = el("button", "btn", "🔊 틀어 놓고 받아 적기");
    play.style.display = "none";
    play.addEventListener("click", function () {
      if (state === "playing") { player.pause(); return; }   // onpause 에서 정리한다
      if (!wantRecog) { toast("받아쓰기는 크롬에서 됩니다."); return; }
      warn.textContent = "🔊 소리를 틀어 마이크가 듣습니다. 이어폰은 빼 주세요.";
      status.textContent = "마이크를 여는 중…";
      navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      }).then(function (s) {
        stream = s;
        state = "playing"; sync();
        status.textContent = "틀어 놓고 받아 적는 중…";
        keepAwake();
        listenLevel(s);
        startRecog();
        player.currentTime = 0;
        player.play().catch(function (e) {
          toast("소리를 틀지 못했습니다: " + errText(e));
          endPlay();
        });
      }).catch(function (e) {
